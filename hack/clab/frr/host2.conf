! host2 (kind worker node) — announces its underlay /64 via unnumbered eBGP.
! See host1.conf for the model; host2 announces fd00:db8:0:2::/64 (its dummy0 /64,
! which flowplane on this node infers via `infer-underlay`).
frr defaults datacenter
hostname host2
!
interface eth1
 no ipv6 nd suppress-ra
!
bfd
 profile fabric-fast
  transmit-interval 150
  receive-interval 150
  detect-multiplier 3
 exit
exit
!
router bgp 65100
 bgp router-id 10.0.2.2
 bgp bestpath as-path multipath-relax
 neighbor eth1 interface remote-as external
 neighbor eth1 bfd profile fabric-fast
 !
 address-family ipv6 unicast
  maximum-paths 64
  network fd00:db8:0:2::/64
  neighbor eth1 activate
  neighbor eth1 allowas-in 1
 exit-address-family
!
