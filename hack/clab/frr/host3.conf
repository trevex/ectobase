! host3 (kind control-plane node) — announces its underlay /64 via unnumbered eBGP.
!
! Mirrors the reference model where each host announces a /64 that lives on dummy0
! (reference: host3 -> fd00:db8:0:3::/64). Here host1 is a kind node running the
! xdp-dp dataplane; `dummy0` is created with this /64 by the clab `exec` on the
! ext-container, and xdp-dp's `infer-underlay` reads it back. This FRR instance runs
! in the SAME network namespace as the kind node (clab network-mode: container:...),
! so it sees dummy0 and its uplink (eth1 -> sw1), and advertises the /64 into BGP.
!
! allowas-in on the uplink lets host3 accept the other host's /64 even though it
! transited a session that shares host3's own AS (both hosts are AS 65100), matching
! the reference's per-tier shared-ASN + allowas-in pattern.
frr defaults datacenter
hostname host3
!
! dummy0 carries the announced /64; no BGP on it, it is just the origin prefix.
interface eth1
 no ipv6 nd suppress-ra
!
bfd
 profile fabric-fast
  transmit-interval 150
  receive-interval 150
  detect-multiplier 3
 exit
exit
!
router bgp 65100
 bgp router-id 10.0.2.3
 bgp bestpath as-path multipath-relax
 neighbor eth1 interface remote-as external
 neighbor eth1 bfd profile fabric-fast
 !
 address-family ipv6 unicast
  maximum-paths 64
  network fd00:db8:0:3::/64
  neighbor eth1 activate
  neighbor eth1 allowas-in 1
 exit-address-family
!
