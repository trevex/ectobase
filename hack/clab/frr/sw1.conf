! Lean IPv6-fabric ToR — adapted from icn/sandbox/configs/frr/sw1.conf.
!
! Difference from the reference: there, the switch ORIGINATES each host's SLAAC
! /64 (the hosts are SLAAC clients). Here the "hosts" are kind nodes running the
! flowplane dataplane; each one puts its OWN underlay /64 on a `dummy0` and ANNOUNCES
! it over unnumbered eBGP (`network fd00:db8:0:N::/64` in host{1,2}.conf). So this
! switch only has to (a) run unnumbered eBGP toward each host and (b) re-advertise
! what it learns so the other host's /64 is reachable — i.e. plain eBGP transit.
! That is exactly what flowplane's underlay inference needs: node1 infers
! fd00:db8:0:1::/64 from its dummy0, node2 infers fd00:db8:0:2::/64, and the ToR
! routes each /64 to the other so cross-node overlay traffic works.
!
! Unnumbered peering (`neighbor ethN interface remote-as external`) needs an IPv6
! link-local on every peering interface; containerlab/kind veths get an EUI-64 LLA
! by default (addr_gen_mode=eui64), so no extra step is required here.
frr defaults datacenter
hostname sw1
!
! host-facing links are pure BGP transit: link-local only, no interface address,
! no RA prefix origination (the hosts own their /64s). We keep RAs suppressed.
interface eth1
 no ipv6 nd suppress-ra
!
interface eth2
 no ipv6 nd suppress-ra
!
interface eth3
 no ipv6 nd suppress-ra
!
! eth4: the 4th host = the gateway cluster k03 (k03-control-plane).
interface eth4
 no ipv6 nd suppress-ra
!
! eth5: the WAN edge #1 (edge1, a VyOS node + flowplane sidecar). RAs on so the edge's kernel learns
! this ToR as its "router" neighbour (the edge sidecar resolves the gateway MAC from it).
interface eth5
 no ipv6 nd suppress-ra
!
! BFD: sub-second failover profile (150 ms x 3), same as the reference fabric.
bfd
 profile fabric-fast
  transmit-interval 150
  receive-interval 150
  detect-multiplier 3
 exit
exit
!
router bgp 65010
 bgp router-id 10.0.1.1
 bgp bestpath as-path multipath-relax
 neighbor eth1 interface remote-as external
 neighbor eth1 bfd profile fabric-fast
 neighbor eth2 interface remote-as external
 neighbor eth2 bfd profile fabric-fast
 neighbor eth3 interface remote-as external
 neighbor eth3 bfd profile fabric-fast
 neighbor eth4 interface remote-as external
 neighbor eth4 bfd profile fabric-fast
 neighbor eth5 interface remote-as external
 neighbor eth5 bfd profile fabric-fast
 !
 address-family ipv6 unicast
  maximum-paths 64
  neighbor eth1 activate
  neighbor eth2 activate
  neighbor eth3 activate
  neighbor eth4 activate
  neighbor eth5 activate
 exit-address-family
!
