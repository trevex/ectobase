# kind cluster for the flowplane IPv6-fabric e2e. Two nodes = two "hosts": the
# control-plane node announces fd00:db8:0:1::/64, the worker announces
# fd00:db8:0:2::/64 (see hack/clab/frr/host{1,2}.conf and ipv6-fabric.clab.yml).
#
# ipv6 family: the fabric under test is IPv6-only, and we want the kind nodes to
# have IPv6 enabled in their netns. (Pod/Service CIDRs here are the cluster overlay,
# unrelated to the fabric /64s on dummy0 — the fabric prefixes are added by clab
# `exec`, not by kind.) containerlab pins/attaches the node containers; kind just
# provides them.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  ipFamily: ipv6
  # No kindnet: kindnet reconciles `ip -6 route add <peer-pod-CIDR> via <peer-InternalIP>`,
  # which EHOSTUNREACHes on our per-node /64 fabric (the peer InternalIP is a BGP-recursive,
  # non-on-link gateway) and crash-loops. Cilium (hack/clab/cilium-up.sh) runs in TUNNEL mode
  # instead, encapsulating pod traffic to the peer NODE IP — no pod routes in the underlay.
  disableDefaultCNI: true
  # Cilium runs with kubeProxyReplacement=true (eBPF Services), so kube-proxy is not deployed.
  kubeProxyMode: none
nodes:
  - role: control-plane
    image: ghcr.io/trevex/ectobase/kind-node-fabric:dev
    extraMounts:
      - hostPath: ${CLAB_PREFIX_DIR}/k01-control-plane.prefix
        containerPath: /etc/fabric/prefix
        readOnly: true
      - hostPath: ${CLAB_PREFIX_DIR}/uplinks
        containerPath: /etc/fabric/uplinks
        readOnly: true
  - role: worker
    image: ghcr.io/trevex/ectobase/kind-node-fabric:dev
    extraMounts:
      - hostPath: ${CLAB_PREFIX_DIR}/k01-worker.prefix
        containerPath: /etc/fabric/prefix
        readOnly: true
      - hostPath: ${CLAB_PREFIX_DIR}/uplinks
        containerPath: /etc/fabric/uplinks
        readOnly: true
