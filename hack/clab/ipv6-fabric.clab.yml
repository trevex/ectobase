# Lean IPv6-only, BGP-unnumbered containerlab fabric for flowplane underlay-inference
# e2e testing. Adapted from icn/sandbox/topologies/fabric.clab.yml — stripped to the
# minimum that exercises: (1) each "host" node announcing a per-node /64 that lives on
# dummy0, and (2) the fabric routing each /64 to the other so cross-node reach works.
#
# NO VyOS edges, NO NAT64/DNS64, NO Garden-Linux VMs. Just one FRR ToR (sw1) and one
# kind cluster whose two nodes (control-plane + worker) are the "hosts" running flowplane.
#
# Integration approach (see hack/clab/README.md for the proven-vs-new breakdown):
#   * `k8s-kind` node  -> containerlab creates/owns the kind cluster lifecycle.
#   * `ext-container` nodes -> the kind node containers (<cluster>-control-plane,
#     <cluster>-worker), addressable as clab link endpoints. This is the DOCUMENTED
#     containerlab way to wire kind nodes into a clab fabric.
#   * A per-host FRR `linux` sidecar shares the kind node's netns
#     (network-mode: container:<kind-node>) so it can (a) create dummy0 with the /64
#     and (b) speak unnumbered eBGP over the kind node's fabric uplink — WITHOUT
#     running FRR inside the kubelet/containerd node image. flowplane runs in that same
#     netns and infers the /64 from dummy0.

name: xdp-ipv6-fabric

# Management network: keep it IPv4-only. Containerlab (>=0.68) otherwise auto-assigns
# an IPv6 mgmt subnet and installs a default route via its gateway on every node's
# eth0; in zebra that kernel-boot default (admin distance 0) outranks the fabric's
# BGP routes and IPv6 egress would leave via the mgmt bridge instead of the fabric.
# Tests reach nodes over docker exec, so mgmt IPv6 is unused. (Copied verbatim from
# the reference lab — it matters.)
mgmt:
  network: xdp-clab
  ipv4-subnet: 172.20.21.0/24
  ipv6-subnet: ""

topology:
  defaults:
    env:
      TZ: UTC

  kinds:
    linux:
      image: frrouting/frr:latest

  nodes:
    # --- ToR / spine: FRR (AS 65010, IPv6 forwarding on) ---
    sw1:
      kind: linux
      binds:
        - frr/daemons:/etc/frr/daemons
        - frr/sw1.conf:/etc/frr/frr.conf
      sysctls:
        net.ipv6.conf.all.forwarding: 1

    # --- second ToR / spine: sw2 (dual-homing; no sw1-sw2 interlink) ---
    sw2:
      kind: linux
      binds:
        - frr/daemons:/etc/frr/daemons
        - frr/sw2.conf:/etc/frr/frr.conf
      sysctls:
        net.ipv6.conf.all.forwarding: 1

    # xdp_pass on each ToR's edge-facing port (eth5): the WAN edge's wan_rx bpf_redirects NAT
    # returns out its fabric uplink, and a containerlab veth only accepts an XDP_REDIRECT if the
    # PEER (this ToR port) has an XDP program (a veth artifact — real NICs don't need it). Shares
    # the ToR netns; attaches once the edge link exists.
    sw1-pass:
      kind: linux
      image: ghcr.io/trevex/ectobase/flowplane:dev
      network-mode: container:clab-xdp-ipv6-fabric-sw1
      binds:
        - sw-pass-wrapper.sh:/sw-pass-wrapper.sh:ro
        - /sys/fs/bpf:/sys/fs/bpf
      entrypoint: "/bin/sh /sw-pass-wrapper.sh"
    sw2-pass:
      kind: linux
      image: ghcr.io/trevex/ectobase/flowplane:dev
      network-mode: container:clab-xdp-ipv6-fabric-sw2
      binds:
        - sw-pass-wrapper.sh:/sw-pass-wrapper.sh:ro
        - /sys/fs/bpf:/sys/fs/bpf
      entrypoint: "/bin/sh /sw-pass-wrapper.sh"

    # --- kind cluster: containerlab owns its lifecycle ---
    # The two kind nodes (control-plane + worker) are the "hosts" running flowplane.
    k01:
      kind: k8s-kind
      startup-config: kind-cluster.yaml.gen
      extras:
        k8s_kind:
          deploy:
            wait: 120s   # clab k8s-kind boot-marker scan timeout (NOT a node-Ready gate); must exceed fabric-preboot boot delay

    # --- second kind cluster: a compute cluster brokered to k01's central control
    # plane (reflector + CRDs) over the shared fabric. One node, its own /64. ---
    k02:
      kind: k8s-kind
      startup-config: kind-cluster-k02.yaml.gen
      extras:
        k8s_kind:
          deploy:
            wait: 120s   # clab k8s-kind boot-marker scan timeout (NOT a node-Ready gate); must exceed fabric-preboot boot delay

    # --- third kind cluster: the GATEWAY host (k03), also brokered to k01's control
    # plane over the fabric. One node, /64 = fd00:db8:0:4::/64. It is dual-homed to
    # sw1/sw2 like the others (eth1/eth2 = BGP fabric uplinks) AND has a third uplink
    # eth3 to the WAN edge — its egress path to the "internet". eth3 is NOT a BGP
    # uplink (see kind-cluster-k03.yaml). ---
    k03:
      kind: k8s-kind
      startup-config: kind-cluster-k03.yaml.gen
      extras:
        k8s_kind:
          deploy:
            wait: 120s   # clab k8s-kind boot-marker scan timeout (NOT a node-Ready gate); must exceed fabric-preboot boot delay

    # --- kind node containers, as clab link endpoints ---
    # Names MUST match the containers kind creates: <cluster>-control-plane / -worker.
    # The custom node image owns dummy0 + the /64 and speaks eBGP itself now (via the
    # fabric-preboot oneshot), so no `exec` and no FRR sidecars here — the nodes are
    # bare link endpoints for the eth1 uplinks.
    k01-control-plane:
      kind: ext-container
    k01-worker:
      kind: ext-container
    # k02's single node: the compute cluster's fabric host, /64 = fd00:db8:0:3::/64.
    k02-control-plane:
      kind: ext-container
    # k03's single node: a compute host like the others, /64 = fd00:db8:0:4::/64. (In the
    # distributed egress model there is no centralized "gateway host" — every hypervisor SNATs its
    # own sources; the WAN edge is the VyOS+flowplane sidecar below.) eth1/eth2 (fabric BGP) are owned
    # by the node image's fabric-preboot oneshot.
    k03-control-plane:
      kind: ext-container

    # --- WAN edge (HA): two VyOS nodes (edge1, edge2), each with an flowplane sidecar sharing its
    # netns. VyOS owns BGP + WAN forwarding (what real hardware runs); the flowplane sidecar owns the
    # overlay (uplink_rx decap of egress + wan_rx re-encap of nat_ip returns). Both edges announce
    # the ANYCAST edge underlay fd00:db8:0:9::e/128, so the fabric ECMPs egress across them and
    # either edge handles any return (drain-safe/stateless). eth1 = fabric (edge1->sw1, edge2->sw2);
    # eth2 = the `clabwan` host bridge = the real internet via the host masquerade (hack/clab/
    # wan-up.sh). NAT64 is done on the source hypervisor (nat64.rs), so no Tayga here. ---
    clabwan:
      # A pre-existing host bridge (created by hack/clab/wan-up.sh, which also does the
      # nat_ip -> real-uplink masquerade + the return route back to the edges).
      kind: bridge
    edge1:
      kind: vyosnetworks_vyos
      image: vyos:latest
      startup-config: vyos/edge1.boot
      # NOT enforced: clab's vyos enforce step runs `docker exec -it <edge> su - admin`, but
      # this image's user is `vyos` (no `admin`) AND `-it` needs a TTY — so enforce fails and
      # clab RETRIES FOREVER (the "deploy hang"), esp. headless/CI. The config is delivered as
      # config.boot (mounted at /opt/vyatta/etc/config) and applied at BOOT regardless, so the
      # edge comes up fully configured (BGP established) without the enforce step. See README.
      enforce-startup-config: false
      sysctls:
        net.ipv6.conf.all.forwarding: 1
        net.ipv4.ip_forward: 1
    edge2:
      kind: vyosnetworks_vyos
      image: vyos:latest
      startup-config: vyos/edge2.boot
      enforce-startup-config: false   # see edge1 — enforce (`su - admin`, needs TTY) hangs clab; config.boot applies at boot
      sysctls:
        net.ipv6.conf.all.forwarding: 1
        net.ipv4.ip_forward: 1
    # flowplane sidecars: share each edge's netns (no links of their own), attach uplink_rx (eth1) +
    # wan_rx (eth2). The wrapper waits for the links + resolves the ToR MAC, then `serve --role
    # edge`. Privileged + /sys/fs/bpf for XDP; SKB mode (clab veths have no native XDP).
    edge1-xdp:
      kind: linux
      image: ghcr.io/trevex/ectobase/flowplane:dev
      network-mode: container:clab-xdp-ipv6-fabric-edge1
      # EDGE_ID gives this sidecar its OWN bpffs pin namespace (/sys/fs/bpf/flowplane-edge1). Both
      # edge sidecars are co-located on one host + bind-mount the same /sys/fs/bpf, so a shared pin
      # dir collides their LOCAL/CONNTRACK maps (distinct eth1 MACs -> OTHERHOST drop). See wrapper.
      env:
        EDGE_ID: edge1
      # Give VyOS time to boot + clab to wire eth1/eth2; the wrapper additionally waits for the
      # interfaces + the ToR neighbour before serving. (A stages.create.wait-for the VyOS `healthy`
      # stage HANGS clab deploy — the healthy-stage never registers for the vyos kind — so a fixed
      # startup-delay is the robust choice.)
      startup-delay: 25
      # The image ENTRYPOINT is `flowplane`; override it to run the wrapper (clab already runs all
      # nodes privileged, so XDP attach in the shared VyOS netns works; /sys/fs/bpf for bpffs).
      binds:
        - edge-xdp-wrapper.sh:/edge-xdp-wrapper.sh:ro
        - /sys/fs/bpf:/sys/fs/bpf
      entrypoint: "/bin/sh /edge-xdp-wrapper.sh"
    edge2-xdp:
      kind: linux
      image: ghcr.io/trevex/ectobase/flowplane:dev
      network-mode: container:clab-xdp-ipv6-fabric-edge2
      env:
        EDGE_ID: edge2   # own bpffs pin namespace (/sys/fs/bpf/flowplane-edge2) — see edge1-xdp
      startup-delay: 25
      binds:
        - edge-xdp-wrapper.sh:/edge-xdp-wrapper.sh:ro
        - /sys/fs/bpf:/sys/fs/bpf
      entrypoint: "/bin/sh /edge-xdp-wrapper.sh"

    # --- shared Ceph/demo storage node (Tier-2 storage fencing) ---
    # ceph runs the all-in-one quay.io/ceph/demo image (mon+mgr+osd+mds) with an IPv6-only
    # public network = its own fabric /64 (fd00:db8:0:5::/64, mon fd00:db8:0:5::1). Unlike the
    # kind hosts, this is a NON-kind container with no fabric-preboot oneshot, so a co-netns FRR
    # sidecar (ceph-frr) creates dummy0 + speaks unnumbered eBGP for it (mirrors edge*-xdp). Each
    # compute node reaches the mon via its own /64 underlay = the Tier-2 fence coordinate.
    ceph:
      kind: linux
      image: quay.io/ceph/demo:latest
      env:
        MON_IP: fd00:db8:0:5::1
        CEPH_PUBLIC_NETWORK: fd00:db8:0:5::/64
      binds:
        - ceph-etc:/etc/ceph
        - ceph-data:/var/lib/ceph
      sysctls:
        net.ipv6.conf.all.forwarding: 1
    # ceph-frr: shares the ceph netns; creates dummy0 (fd00:db8:0:5::1/64) then runs FRR to
    # announce fd00:db8:0:5::/64 over unnumbered eBGP, dual-homed to sw1/sw2 (frr/ceph.conf).
    ceph-frr:
      kind: linux
      image: frrouting/frr:latest
      network-mode: container:clab-xdp-ipv6-fabric-ceph
      binds:
        - frr/daemons:/etc/frr/daemons
        - frr/ceph.conf:/etc/frr/frr.conf
        - ceph-preboot.sh:/ceph-preboot.sh:ro
      entrypoint: "/bin/sh /ceph-preboot.sh"

  # All fabric links are MTU 3000 (clab defaults veths to 9500). Native/driver XDP on a veth requires
  # MTU <= ~3500 (a linear-buffer limit); at 9500 the loader silently falls back to SKB/generic. We
  # prefer native everywhere on clab ("closer to real hardware"), and the edge REQUIRES native for its
  # decap+XDP_PASS local-deliver (generic leaves skb->protocol stale). 3000 comfortably carries a
  # 1500-MTU guest's encapped frame (outer IPv6 40 + inner IP 1500 = 1540) with headroom. The
  # dataplane itself is MTU-agnostic; this is purely a harness knob to unlock native — jumbo on real
  # hardware would use native+XDP-frags instead.
  links:
    # host uplinks to the ToR (unnumbered v6, link-local only). The kind node netns
    # receives eth1; the shared-netns FRR sidecar peers over it.
    - endpoints: ["k01-control-plane:eth1", "sw1:eth1"]
      mtu: 3000
    - endpoints: ["k01-worker:eth1", "sw1:eth2"]
      mtu: 3000
    - endpoints: ["k02-control-plane:eth1", "sw1:eth3"]
      mtu: 3000
    # the gateway host (k03) is the 4th fabric host -> sw1:eth4 / sw2:eth4.
    - endpoints: ["k03-control-plane:eth1", "sw1:eth4"]
      mtu: 3000
    # second uplink per node to sw2 (dual-homing)
    - endpoints: ["k01-control-plane:eth2", "sw2:eth1"]
      mtu: 3000
    - endpoints: ["k01-worker:eth2", "sw2:eth2"]
      mtu: 3000
    - endpoints: ["k02-control-plane:eth2", "sw2:eth3"]
      mtu: 3000
    - endpoints: ["k03-control-plane:eth2", "sw2:eth4"]
      mtu: 3000
    # --- WAN edge (HA): each VyOS edge single-homes to a distinct ToR (eth1) and faces the
    # clabwan host bridge on eth2 (the real internet). The flowplane sidecars share the edges' netns
    # (no links of their own). ---
    - endpoints: ["edge1:eth1", "sw1:eth5"]
      mtu: 3000
    - endpoints: ["edge2:eth1", "sw2:eth5"]
      mtu: 3000
    - endpoints: ["edge1:eth2", "clabwan:e1wan"]
      mtu: 3000
    - endpoints: ["edge2:eth2", "clabwan:e2wan"]
      mtu: 3000
    # --- shared Ceph storage node: dual-homed to both ToRs (eth1->sw1:eth6, eth2->sw2:eth6),
    # the next free port on each ToR. The ceph-frr sidecar (in the ceph netns) peers over both
    # and announces fd00:db8:0:5::/64 so every compute node reaches the mon from its own /64. ---
    - endpoints: ["ceph:eth1", "sw1:eth6"]
      mtu: 3000
    - endpoints: ["ceph:eth2", "sw2:eth6"]
      mtu: 3000
