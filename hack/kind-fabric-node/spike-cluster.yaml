# Single-node spike: prove kubelet Node InternalIP = the fabric /64 addr
# (fd00:db8:0:1::1), set pre-kubelet by fabric-preboot, surviving a container
# restart. No clab/FRR yet — the address is local (dummy0), so no BGP is needed
# for kubelet to bind/report it. apiserver stays on docker (hybrid).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  ipFamily: ipv6
nodes:
  - role: control-plane
    image: ghcr.io/trevex/ectobase/kind-node-fabric:spike
    extraMounts:
      - hostPath: /tmp/fabric-prefix-cp
        containerPath: /etc/fabric/prefix
        readOnly: true
