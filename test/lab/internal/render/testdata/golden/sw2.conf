! Generated from templates/frr/switch.conf.tmpl — do not edit by hand.
! ToR switch (AS 65010) — pure /128 relay with ECMP. Peers unnumbered to the
! two edges and to every compute node (+ optional ceph). Nodes share AS 65100,
! so host neighbors get as-override to re-propagate each node's /128 to the others.
! No interface addresses, no originated /64, no router-advert (the pure /128-VTEP model).
frr defaults datacenter
hostname sw2
!
interface eth1
 no ipv6 nd suppress-ra
!
interface eth2
 no ipv6 nd suppress-ra
!
interface eth3
 no ipv6 nd suppress-ra
!
interface eth4
 no ipv6 nd suppress-ra
!
interface eth5
 no ipv6 nd suppress-ra
!
bfd
 profile fabric-fast
  transmit-interval 150
  receive-interval 150
  detect-multiplier 3
 exit
exit
!
router bgp 65010
 bgp router-id 10.0.1.2
 bgp bestpath as-path multipath-relax
 ! Edges (unnumbered).
 neighbor eth1 interface remote-as external
 neighbor eth1 bfd profile fabric-fast
 neighbor eth2 interface remote-as external
 neighbor eth2 bfd profile fabric-fast
 ! Compute-node host ports (unnumbered, shared AS 65100).
 neighbor eth3 interface remote-as external
 neighbor eth3 bfd profile fabric-fast
 neighbor eth4 interface remote-as external
 neighbor eth4 bfd profile fabric-fast
 neighbor eth5 interface remote-as external
 neighbor eth5 bfd profile fabric-fast
 !
 address-family ipv6 unicast
  maximum-paths 64
  neighbor eth1 activate
  neighbor eth2 activate
  neighbor eth3 activate
  neighbor eth3 as-override
  neighbor eth4 activate
  neighbor eth4 as-override
  neighbor eth5 activate
  neighbor eth5 as-override
 exit-address-family
!
