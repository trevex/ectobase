apiVersion: v1alpha1
kind: KubeNetworkConfig
podSubnets:
  - fd00:244:f55a::/56
serviceSubnets:
  - fd00:96:f55a::/108
---
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
    - fd00:cafe:f55a::/64
---
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: fd00:ffff::e1
  - address: fd00:ffff::e2
---
# Cilium replaces kube-proxy (kubeProxyReplacement), so disable Talos' kube-proxy.
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
cluster:
  etcd:
    advertisedSubnets:
      - fd00:cafe:f55a::/64
    extraArgs:
      max-learners: "3"
machine:
  # Accept RA-installed default routes on BOTH fabric uplinks. The nodes forward
  # (IPv6 forwarding on, for the guest<->fabric datapath), and with forwarding on the
  # kernel installs an RA default only when accept_ra=2 (=1 accepts the RA for SLAAC
  # but drops the default). Without this pin the value is inconsistent per node/iface
  # (kernel/bring-up quirk demotes some uplinks to 1), so a node could end up with no
  # RA default and fall back to the GoBGP-learned ::/0 — both are fabric egress, but
  # this makes it deterministic: every node gets a fabric-preferred `proto ra` default
  # (ECMP across eth1+eth2). Talos reconciles machine.sysctls, so the pin survives the
  # demoter. (The overlay egress uses the BGP-installed remote /64s, not the default,
  # so the default's provenance never affects it.)
  sysctls:
    net.ipv6.conf.eth1.accept_ra: "2"
    net.ipv6.conf.eth2.accept_ra: "2"
  # Pull-through + push-local mirror on the fabric: every upstream resolves to the
  # in-fabric registry so pulls stay node->fabric->registry (finalized in Task 13/16).
  registries:
    mirrors:
      docker.io:
        endpoints:
          - http://[fd00:29::5]:5000
      ghcr.io:
        endpoints:
          - http://[fd00:29::5]:5000
  # Health-gated anycast API VIP: a per-node static pod holds vip0 only while the
  # local apiserver /healthz is ok; GoBGP advertises vip0 (see BGPPeerConfig), so an
  # unhealthy node withdraws itself from the anycast set instead of black-holing.
  pods:
    - apiVersion: v1
      kind: Pod
      metadata:
        name: api-vip
        namespace: kube-system
      spec:
        hostNetwork: true
        containers:
          - name: agent
            image: alpine:3
            securityContext:
              capabilities:
                add: ["NET_ADMIN"]
            command: ["/bin/sh", "-c"]
            args:
              - |
                ip link add vip0 type dummy 2>/dev/null || true
                ip link set vip0 up
                vip=fd00:cafe:f55a:1::1/128
                while :; do
                  # Fabric-preferred egress ("no side channel"): demote the docker
                  # mgmt default to a high metric so internet-bound traffic leaves
                  # via the fabric (GoBGP/RA default metric 1024 → edge → tayga
                  # NAT64 / wan native-v6), keeping mgmt only as a last-resort
                  # fallback so control-plane image pulls never stall during boot.
                  # Re-run each tick in case DHCP re-adds the metric-1024 default.
                  # (Unconditional del+add — busybox `ip` output spacing makes a
                  # grep guard fragile; the add is a no-op once already at 4096.)
                  ip -6 route del default via 3fff:172:20:20::1 dev eth0 metric 1024 2>/dev/null || true
                  ip -6 route add default via 3fff:172:20:20::1 dev eth0 metric 4096 2>/dev/null || true
                  if wget -q -T2 --no-check-certificate -O- https://127.0.0.1:6443/healthz 2>/dev/null | grep -qx ok; then
                    ip addr add "$vip" dev vip0 2>/dev/null || true
                  else
                    ip addr del "$vip" dev vip0 2>/dev/null || true
                  fi
                  sleep 2
                done
