# Generated from templates/fabric.clab.yml.tmpl — do not edit by hand.
name: ectobase

mgmt:
  network: ectobase-mgmt
  ipv4-subnet: 172.20.20.0/24
  ipv6-subnet: 3fff:172:20:20::/64

topology:
  defaults:
    env:
      TZ: UTC

  nodes:
    edge1:
      kind: vyosnetworks_vyos
      image: img/vyos
      startup-config: vyos/edge1.boot
      enforce-startup-config: true
      sysctls: {net.ipv6.conf.all.forwarding: 1}
    edge2:
      kind: vyosnetworks_vyos
      image: img/vyos
      startup-config: vyos/edge2.boot
      enforce-startup-config: true
      sysctls: {net.ipv6.conf.all.forwarding: 1}

    nat64-1:
      kind: linux
      image: img/tayga
      cap-add: ["NET_ADMIN"]
      devices: ["/dev/net/tun"]
      env:
        V6_ADDR: fd00:64:1::2/64
        V6_GW: fd00:64:1::1
        WAN_ADDR: 172.29.0.21/24
        WAN_GW: 172.29.0.1
        POOL: 172.29.64.0/24
        POOL_ADDR: 172.29.64.1
    nat64-2:
      kind: linux
      image: img/tayga
      cap-add: ["NET_ADMIN"]
      devices: ["/dev/net/tun"]
      env:
        V6_ADDR: fd00:64:2::2/64
        V6_GW: fd00:64:2::1
        WAN_ADDR: 172.29.0.22/24
        WAN_GW: 172.29.0.1
        POOL: 172.29.65.0/24
        POOL_ADDR: 172.29.65.1

    sw1:
      kind: vyosnetworks_vyos
      image: img/vyos
      startup-config: vyos/sw1.boot
      enforce-startup-config: true
      sysctls: {net.ipv6.conf.all.forwarding: 1}
    sw2:
      kind: vyosnetworks_vyos
      image: img/vyos
      startup-config: vyos/sw2.boot
      enforce-startup-config: true
      sysctls: {net.ipv6.conf.all.forwarding: 1}
    central-1:
      kind: linux
      image: img/talos
      # containerlab runs every node privileged, so Talos boots in container mode
      # with a writable rootfs; it reads its machine config from USERDATA. Talos'
      # SetupSharedFilesystems marks /var, /etc/cni and /run MS_SHARED, which needs
      # them to be real mount points (containerlab has no tmpfs key), so we bind
      # per-node dirs. They live on disk under build/<name>/mounts — a bind is a
      # mount point regardless of backing store, so this keeps /var off RAM.
      env:
        PLATFORM: container
      env-files: [talos/central-1.env]
      binds:
        - mounts/central-1/run:/run
        - mounts/central-1/var:/var
        - mounts/central-1/cni:/etc/cni
        - /usr/lib/modules:/usr/lib/modules:ro
      sysctls:
        net.ipv6.conf.all.disable_ipv6: "0"
    k02-1:
      kind: linux
      image: img/talos
      # containerlab runs every node privileged, so Talos boots in container mode
      # with a writable rootfs; it reads its machine config from USERDATA. Talos'
      # SetupSharedFilesystems marks /var, /etc/cni and /run MS_SHARED, which needs
      # them to be real mount points (containerlab has no tmpfs key), so we bind
      # per-node dirs. They live on disk under build/<name>/mounts — a bind is a
      # mount point regardless of backing store, so this keeps /var off RAM.
      env:
        PLATFORM: container
      env-files: [talos/k02-1.env]
      binds:
        - mounts/k02-1/run:/run
        - mounts/k02-1/var:/var
        - mounts/k02-1/cni:/etc/cni
        - /usr/lib/modules:/usr/lib/modules:ro
      sysctls:
        net.ipv6.conf.all.disable_ipv6: "0"
    k02-2:
      kind: linux
      image: img/talos
      # containerlab runs every node privileged, so Talos boots in container mode
      # with a writable rootfs; it reads its machine config from USERDATA. Talos'
      # SetupSharedFilesystems marks /var, /etc/cni and /run MS_SHARED, which needs
      # them to be real mount points (containerlab has no tmpfs key), so we bind
      # per-node dirs. They live on disk under build/<name>/mounts — a bind is a
      # mount point regardless of backing store, so this keeps /var off RAM.
      env:
        PLATFORM: container
      env-files: [talos/k02-2.env]
      binds:
        - mounts/k02-2/run:/run
        - mounts/k02-2/var:/var
        - mounts/k02-2/cni:/etc/cni
        - /usr/lib/modules:/usr/lib/modules:ro
      sysctls:
        net.ipv6.conf.all.disable_ipv6: "0"
    wan:
      kind: linux
      image: img/wan
      # wan-simulator:latest is mutable and rebuilt often; always re-pull so a
      # deploy never reuses a stale cached image (the stable node images keep
      # clab's IfNotPresent default).
      image-pull-policy: Always
      cap-add: ["NET_ADMIN"]
      env:
        WAN_V4_ADDR: 172.29.0.1/24
        WAN_V6_ADDR: fd00:29::1/64
        WAN_MASQ_V4: "172.29.0.0/16"
        WAN_MASQ_V6: "fd00:cafe::/16 fd00:db8::/32 fd00:ffff::/32 fd00:29::/64"
        WAN_ROUTES: "fd00:cafe::/16 fd00:29::11,fd00:29::12;fd00:db8::/32 fd00:29::11,fd00:29::12;fd00:ffff::/32 fd00:29::11,fd00:29::12"

    registry:
      kind: linux
      image: registry:2
      # Persistent pull-through + push-local mirror. The cache bind + the node's
      # fabric address/config are finalized in Task 13 (registry) + Task 16 (up);
      # a host-path cache dir is used because clab binds cannot name docker volumes.
      binds:
        - registry/config.yml:/etc/distribution/config.yml
        - registry-cache:/var/lib/registry

  links:
    - endpoints: ["edge1:eth1", "sw1:eth1"]
      mtu: 1500
    - endpoints: ["edge1:eth2", "sw2:eth1"]
      mtu: 1500
    - endpoints: ["edge2:eth1", "sw1:eth2"]
      mtu: 1500
    - endpoints: ["edge2:eth2", "sw2:eth2"]
      mtu: 1500
    - endpoints: ["central-1:eth1", "sw1:eth3"]
      mtu: 1500
    - endpoints: ["central-1:eth2", "sw2:eth3"]
      mtu: 1500
    - endpoints: ["k02-1:eth1", "sw1:eth4"]
      mtu: 1500
    - endpoints: ["k02-1:eth2", "sw2:eth4"]
      mtu: 1500
    - endpoints: ["k02-2:eth1", "sw1:eth5"]
      mtu: 1500
    - endpoints: ["k02-2:eth2", "sw2:eth5"]
      mtu: 1500
    - endpoints: ["edge1:eth3", "wan:eth1"]
      mtu: 1500
    - endpoints: ["edge2:eth3", "wan:eth2"]
      mtu: 1500
    - endpoints: ["edge1:eth4", "nat64-1:eth1"]
      mtu: 1500
    - endpoints: ["edge2:eth4", "nat64-2:eth1"]
      mtu: 1500
    - endpoints: ["nat64-1:eth2", "wan:eth3"]
      mtu: 1500
    - endpoints: ["nat64-2:eth2", "wan:eth4"]
      mtu: 1500
    - endpoints: ["registry:eth1", "wan:eth5"]
      mtu: 1500
