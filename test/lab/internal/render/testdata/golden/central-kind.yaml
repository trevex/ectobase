kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  ipFamily: ipv6
  disableDefaultCNI: true
  kubeProxyMode: none
# Pull :dev + upstream images through the in-fabric registry mirror (fabric-parity
# with the removed Talos machine.registries.mirrors). [fd00:29::5]:5000 = [fd00:29::5]:5000.
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."ghcr.io"]
      endpoint = ["http://[fd00:29::5]:5000"]
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."quay.io"]
      endpoint = ["http://[fd00:29::5]:5000"]
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."docker.io"]
      endpoint = ["http://[fd00:29::5]:5000"]
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."registry.k8s.io"]
      endpoint = ["http://[fd00:29::5]:5000"]
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."gcr.io"]
      endpoint = ["http://[fd00:29::5]:5000"]
    [plugins."io.containerd.grpc.v1.cri".registry.configs."[fd00:29::5]:5000".tls]
      insecure_skip_verify = true
nodes:
  - role: control-plane
    image: ghcr.io/trevex/ectobase/kind-node-fabric:dev
    extraMounts:
      - hostPath: /build/ectobase/kind/central-1.prefix
        containerPath: /etc/fabric/prefix
        readOnly: true
      - hostPath: /build/ectobase/kind/central-uplinks
        containerPath: /etc/fabric/uplinks
        readOnly: true
