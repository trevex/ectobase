kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  ipFamily: ipv6
  # Use kind's default CNI (kindnet) + kube-proxy — NOT Cilium. The CNI here only
  # serves ordinary pods (the VM/overlay datapath is flowplane's, independent of the
  # pod CNI); kindnet plain-MASQUERADEs pod egress to the per-packet route source (the
  # egress uplink's RA-SLAAC addr, which the WAN masquerades back via the edges), so
  # pods (e.g. the ceph-csi provisioner) reach the in-fabric mon symmetrically. Cilium
  # couldn't masquerade at all on the unnumbered fabric uplinks (per-egress-device SNAT
  # with no address to source from). kindnet's cross-node pod routes would break on the
  # per-/64 fabric, so this assumes 1 node/cluster (the lab default + the Tier-2 gate);
  # multi-node needs flannel.
# Pull :dev + upstream images through the in-fabric registry mirror (fabric-parity
# with the removed Talos machine.registries.mirrors). containerd 2.x: the mirror is
# configured via config_path/hosts.toml (mounted at /etc/containerd/certs.d), NOT the
# legacy inline registry.mirrors — inline mirrors corrupt the CRI plugin on containerd
# v2 (kubelet: "unknown service runtime.v1.RuntimeService").
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    image: ghcr.io/trevex/ectobase/kind-node-fabric:dev
    extraMounts:
      - hostPath: /build/ectobase/kind/hub-1.prefix
        containerPath: /etc/fabric/prefix
        readOnly: true
      - hostPath: /build/ectobase/kind/hub-uplinks
        containerPath: /etc/fabric/uplinks
        readOnly: true
      - hostPath: /build/ectobase/kind/hub-certs.d
        containerPath: /etc/containerd/certs.d
        readOnly: true
