! Generated from templates/frr/edge.conf.tmpl — do not edit by hand.
! WAN edge (AS 65000) — eBPF SIIT/NAT64 decap boundary. Originates ::/0 into
! the fabric (default-originate) and advertises the NAT64 /96 + its loopback. The
! edge sidecar (flowplane-edge1) shares this netns and runs wan_rx; FRR here is only
! the kernel router. IPv6-only fabric: pin the router-id (no v4 to auto-derive).
frr defaults datacenter
hostname edge2
!
! Loopback /128 on lo (no dummy needed): zebra assigns it; BGP advertises it below.
interface lo
 ipv6 address fd00:ffff::e2/128
!
! WAN segment + tayga NAT64 link (addresses assigned by zebra once clab wires them).
interface eth3
 ipv6 address fd00:29::12/64
!
interface eth4
 ipv6 address fd00:64:2::1/64
!
! Unnumbered fabric uplinks toward the two ToRs.
interface eth1
 no ipv6 nd suppress-ra
!
interface eth2
 no ipv6 nd suppress-ra
!
bfd
 profile fabric-fast
  transmit-interval 150
  receive-interval 150
  detect-multiplier 3
 exit
exit
!
! The edge's own FIB: default out the WAN, NAT64 prefix to tayga.
ipv6 route ::/0 fd00:29::1
ipv6 route 64:ff9b::/96 fd00:64:2::2
!
router bgp 65000
 bgp router-id 10.0.0.2
 bgp bestpath as-path multipath-relax
 neighbor eth1 interface remote-as external
 neighbor eth1 bfd profile fabric-fast
 neighbor eth2 interface remote-as external
 neighbor eth2 bfd profile fabric-fast
 !
 address-family ipv6 unicast
  maximum-paths 64
  ! Advertise the loopback + NAT64 /96 explicitly; redistribute connected carries the
  ! WAN /64 (fd00:29::/64) into the fabric — the return path for the P3b host↔WAN jump.
  network fd00:ffff::e2/128
  network 64:ff9b::/96
  redistribute connected
  neighbor eth1 activate
  neighbor eth1 default-originate
  neighbor eth2 activate
  neighbor eth2 default-originate
 exit-address-family
!
