# Cilium values for the kind IPv6 fabric clusters. IPv6-only, tunnel (vxlan)
# routing, kube-proxy replacement.
#
# k8sServiceHost / k8sServicePort are injected at install time (topology.Up) as the
# control-plane container's kind-network IPv6 + 6443: with kube-proxy replaced there
# is no ClusterIP to bootstrap the agents' API connection against, and kubeadm
# advertises the API server on the kind-network address (NOT the Talos KubePrism
# localhost:7445 — that endpoint does not exist on kind).
ipv4:
  enabled: false
ipv6:
  enabled: true

kubeProxyReplacement: true

# Coexist with Multus (required for the KubeVirt network-binding NADs in Tier-2).
# Cilium's default cni.exclusive=true renames Multus's 00-multus.conf so the binding
# NAD is silently ignored; false keeps Multus primary, delegating to Cilium.
cni:
  exclusive: false

routingMode: tunnel
tunnelProtocol: vxlan

# Use the per-node podCIDR kube-controller-manager allocates from kind's default
# podSubnet, matching node.spec.podCIDRs (kind sets --allocate-node-cidrs).
ipam:
  mode: kubernetes

# Single operator replica: clusters default to one control-plane node, and the
# operator's default 2 replicas have anti-affinity that leaves the 2nd Pending on a
# 1-node cluster → `helm --wait` never sees 2/2. One operator is fine for a lab.
operator:
  replicas: 1

# Quieter, faster bring-up: no Hubble UI/relay needed for the e2e.
hubble:
  enabled: false

bpf:
  # iptables (not BPF) masquerade: route-source masquerade below is only supported on
  # the iptables path (the agent rejects enable-masquerade-to-route-source with
  # enable-bpf-masquerade=true). Perf is irrelevant for the lab.
  masquerade: false
enableIPv6Masquerade: true
# Masquerade pod egress to the ROUTE SOURCE — the node's announced identity
# fd00:cafe:<h>::1 (dummy0 = the k8s InternalIP + BGP-advertised address) — not the
# egress device's ephemeral RA-SLAAC uplink address. Without this, pod traffic to a
# fabric /64 (e.g. the ceph mon on fd00:cafe:635::/64) is SNATed to a SLAAC uplink addr
# whose return path breaks, so librbd hangs. The node identity is stable + fabric-routable.
enableMasqueradeRouteSource: true
