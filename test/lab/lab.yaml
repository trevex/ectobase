name: ectobase
images:
  # The flowplane WAN-edge sidecar (shares the edge1 netns, runs wan_rx for N/S LB).
  # Same locally-built :dev image the DaemonSet pushes to the mirror; clab uses the
  # host-local copy (IfNotPresent default), so no remote pull.
  flowplane: ghcr.io/trevex/ectobase/flowplane:dev
  tayga:    ghcr.io/trevex/ectobase/tayga:latest
  wan:      ghcr.io/trevex/ectobase/wan:latest
  # Fabric routers (sw1/sw2/edge1/edge2), custom ISO->rootfs clab build (`make
  # image-vyos`; pin: test/images/vyos/versions.env). Build-locally, host-local
  # image like tayga/wan (IfNotPresent default; no remote pull).
  vyos:     ghcr.io/trevex/ectobase/vyos:clab
  # Talos node image for the docker provisioner (P6 substrate). Mirrored from the
  # tagged upstream release by `make image-talos-mirror` (pin: test/images/talos/
  # versions.env). Like tayga/wan/frr, it is a host-side node/infra image, so it
  # lives here but not in fabric.registry.push (that set is the locally-built :dev
  # app images pushed into the in-fabric mirror).
  talos:    ghcr.io/trevex/ectobase/talos:container
  registry: registry:2
  # frr: edges + switches, plus the ceph FRR sidecar. ceph: only when fabric.ceph.enabled: true.
  # Both pinned by digest (digest-pinned; third-party :latest tags roll — a fresh host would
  # otherwise pull a newer, unvalidated image). These digests are the known-good images the
  # sweep runs on (frr ~v8.x, ceph demo ~reef); bump deliberately when upgrading.
  frr:      frrouting/frr@sha256:990e83490108b686fd6df3b1cafa6bdbb2714acb00eedb9a89693946f46f45ce
  ceph:     quay.io/ceph/demo@sha256:522483cf07cfce6386b8e18a3edfa88a1b32c688dee231d0a6962b1513557723
fabric:
  as: { edge: 65000, switch: 65010, host: 65100 }
  nat64Prefix: 64:ff9b::/96
  registry:
    upstreams: [docker.io, ghcr.io, quay.io, registry.k8s.io, gcr.io]
    push: [flowplane, mesh, cni, dispatch-apiserver, dispatch-controller, dispatch-broker]
  ceph:
    enabled: true
  clusters:
    - { name: dispatch, nodes: 1 }
    - { name: k02, nodes: 1 }
    - { name: k03, nodes: 1 }
