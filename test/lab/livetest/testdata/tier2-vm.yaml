# Tier-2 live-gate fixture — applied to the dispatch. A stateful RBD-backed VirtualMachine on the
# net.ectobase.dev API, PINNED to pool k02 via spec.clusterName. The Phase-3 scheduler SKIPS a VM
# whose spec.clusterName is already set, so this hard-binds the VM to k02 without a labelled pool.
#
# On k02 node death the failover controller re-binds every VM with spec.clusterName==k02 to a
# surviving pool (k03) AFTER the k02 /64 is fenced (Ceph NetworkFence result==Succeeded). Mirrors
# test/e2e/fixtures/multicluster-tier2/vm.yaml but is the canonical fixture the live
# TestTier2Failover gate applies.
#
# This header used to claim "The same RBD (volumeRefs) reattaches on k03." It does NOT, and that
# sentence was wrong for as long as it existed: there is no volumeHandle on CompiledVolumeAttachment
# and no adopt-existing path anywhere, so a rebind provisions a blank image. On a PLANNED move of a
# healthy pool the original is destroyed outright — reproduced live on 2026-09-24, the image vanished
# from the shared Ceph pool within ten seconds. TestTier2Failover creates a Volume but never asserts
# anything about the disk, which is how the claim survived unchallenged.
# Red test: TestVolumeSurvivesClusterRebind (livetest/volumemove_test.go).
# Fix:      docs/superpowers/plans/2026-09-24-phase0-non-destructive-move.md.
---
apiVersion: net.ectobase.dev/v1alpha1
kind: VPC
metadata:
  name: blue
  namespace: default
spec:
  vni: 100
---
# Subnet covering tier2-nic's 10.0.0.20 so the live NICIPAMReconciler adopts the pinned
# spec.ips as a reservation and drives the NIC to status.state=Allocated (compile gate).
apiVersion: net.ectobase.dev/v1alpha1
kind: Subnet
metadata:
  name: blue-subnet
  namespace: default
spec:
  vpcRef:
    name: blue
  v4Prefix: 10.0.0.0/24
---
apiVersion: net.ectobase.dev/v1alpha1
kind: NetworkInterface
metadata:
  name: tier2-nic
  namespace: default
spec:
  vpcRef:
    name: blue
  # The VM's overlay IP (distinct from the multicluster fixture's .1/.3 endpoints).
  ips:
    - 10.0.0.20
  # Pinned MAC — the VMI's virtio NIC MUST carry the same MAC (KubeVirt pod-tap binding).
  mac: "52:54:00:00:00:20"
---
apiVersion: storage.ectobase.dev/v1alpha1
kind: Volume
metadata:
  name: tier2-disk
  namespace: default
spec:
  # Small RBD boot disk. bootImage makes it bootable (imported into the RBD via CDI); the
  # materializer only falls back to a containerDisk when NO volumes are present, so an RBD-backed
  # bootable VM needs a bootImage Volume.
  size: 1Gi
  storageClass: ceph-rbd
  bootImage: "quay.io/containerdisks/fedora:41"
---
apiVersion: compute.ectobase.dev/v1alpha1
kind: VirtualMachine
metadata:
  name: tier2-vm
  namespace: default
spec:
  # Hard-bind to k02 (scheduler skips already-bound VMs). Failover re-writes this to k03.
  clusterName: k02
  interfaceRefs:
    - name: tier2-nic
  # Stateful boot disk — the RBD that must reattach on k03 after the fence.
  volumeRefs:
    - name: tier2-disk
  # RerunOnFailure = Tier-1 local restart; Tier-2 failover re-binds clusterName and the
  # broker/vm-materializer reboots the VMI on the new pool.
  runStrategy: RerunOnFailure
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
