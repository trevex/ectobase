---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: routebusidentities.platform.ectobase.dev
spec:
  group: platform.ectobase.dev
  names:
    kind: RouteBusIdentity
    listKind: RouteBusIdentityList
    plural: routebusidentities
    singular: routebusidentity
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          RouteBusIdentity is a pool's route-bus intermediate-CA request + signed response, served
          by the dispatch aggregated apiserver. The broker creates it; the dispatch signer fills status.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RouteBusIdentitySpec is a request for a route-bus intermediate CA. The requester generates the
              intermediate keypair LOCALLY and submits only the CSR — the private key is never transmitted.
              The dispatch signer returns a name-constrained intermediate that can mint agent leaves scoped to
              it.

              Usually the requester is a ClusterPool (its broker), one identity per pool. The WAN edge FLEET is
              the other kind: an edge is a router rather than a Kubernetes node, so it has no broker and no
              cert-manager — it is modelled as an ordinary identity named `edge`, permitted the edge loopback
              aggregate, and each edge agent mints its own leaf from that intermediate in process.
            properties:
              permittedUnderlayCIDRs:
                description: |-
                  PermittedUnderlayCIDRs are this identity's underlay IPv6 ranges — a pool's /48, or the edge
                  loopback aggregate for the edge fleet. The signer name-constrains the intermediate to these
                  so it can only mint leaves whose IP SAN falls inside them; the reflector then binds route
                  nexthops to that SAN. This constraint, not the minting code, is what bounds a holder of the
                  intermediate — which matters most for the edge, where an agent signs its own leaf locally.
                items:
                  type: string
                type: array
              poolName:
                description: |-
                  PoolName is the identity this intermediate belongs to — a ClusterPool name, or `edge` for
                  the WAN edge fleet. The signed intermediate is name-constrained to it so it can only mint
                  leaves within it.
                type: string
              request:
                description: |-
                  Request is the PEM-encoded PKCS#10 certificate-signing request for the pool's
                  intermediate CA (the pool keeps the matching private key).
                format: byte
                type: string
            type: object
          status:
            description: |-
              RouteBusIdentityStatus carries the signer's response: the signed intermediate and the
              root CA bundle the reflector trusts.
            properties:
              caBundle:
                description: |-
                  CABundle is the PEM-encoded root CA the reflector trusts, so the pool can present the
                  full chain (leaf -> intermediate -> root).
                format: byte
                type: string
              certificate:
                description: Certificate is the PEM-encoded signed intermediate CA
                  certificate (the CSR response).
                format: byte
                type: string
              conditions:
                description: Conditions represent the latest observations (e.g. Signed
                  / Denied).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
