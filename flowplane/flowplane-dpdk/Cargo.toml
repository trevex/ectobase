[package]
name = "flowplane-dpdk"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
flowplane-common = { path = "../flowplane-common", features = ["user"] }
flowplane-control = { path = "../flowplane-control" }
flowplane-core = { path = "../flowplane-core" }
flowplane-device = { path = "../flowplane-device" }
flowplane-node = { path = "../flowplane-node" }
ipnet = { workspace = true }
nfkit = { path = "../nfkit" }
anyhow = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true, features = ["transport"] }
tonic-health = "0.12"
prost = { workspace = true }
clap = { workspace = true }
parking_lot = { workspace = true }
# Direct dep on dpdk-sys (which has `links = "dpdk"`) so this crate's build.rs receives
# `DEP_DPDK_PREFIX` and can re-emit the DPDK static link graph for the bin/test binaries. Mirrors
# how nfkit links its own test/bin artifacts.
dpdk-sys = { path = "../dpdk-sys" }

[build-dependencies]
# tonic-build removed: flowplane-node compiles the proto; flowplane-dpdk re-exports pb from there.

[[bin]]
name = "flowplane-dpdk"
path = "src/main.rs"
