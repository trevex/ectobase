[package]
name = "nfkit"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
arrayvec = "0.7"
libc = "0.2"
dpdk-sys = { path = "../dpdk-sys" }
flowplane-core = { path = "../flowplane-core" }
flowplane-common = { path = "../flowplane-common" }

[dev-dependencies]
etherparse = "0.15"
flowplane-sim = { path = "../flowplane-sim" }
# Control-path parity test (tests/shared_config_parity.rs): program SharedConfigMaps through the
# SAME ControlCore<DpdkMapWriter> the gRPC handlers use. flowplane-dpdk depends on nfkit, so this is
# a dev-dependency cycle (only needed to build nfkit's tests, not the lib) — cargo allows it.
flowplane-control = { path = "../flowplane-control" }
flowplane-dpdk = { path = "../flowplane-dpdk" }
# tap-backed guest datapath test (tests/tap_guest_datapath.rs): create a persistent tap + open its
# guest-facing fd (the qemu analogue) to drive process_guest_tx over af_xdp-on-tap.
flowplane-device = { path = "../flowplane-device" }
