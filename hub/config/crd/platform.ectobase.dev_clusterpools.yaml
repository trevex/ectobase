kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: clusterpools.platform.ectobase.dev
spec:
  group: platform.ectobase.dev
  names:
    kind: ClusterPool
    listKind: ClusterPoolList
    plural: clusterpools
    singular: clusterpool
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ClusterPool is an attached cluster exposed as a schedulable capacity
          domain.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ClusterPoolSpec defines the desired state of a ClusterPool.
            properties:
              endpoint:
                description: Endpoint is the reachable API endpoint of the attached
                  cluster.
                type: string
              region:
                description: Region is the region the attached cluster resides in.
                type: string
            type: object
          status:
            description: ClusterPoolStatus defines the observed state of a ClusterPool.
            properties:
              allocatable:
                additionalProperties:
                  anyOf:
                  - type: integer
                  - type: string
                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                  x-kubernetes-int-or-string: true
                description: Allocatable is the schedulable capacity the broker reports
                  for this pool.
                type: object
              conditions:
                description: Conditions represent the latest available observations
                  of the ClusterPool's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              fencedPrefixes:
                description: FencedPrefixes is the subset of NodePrefixes central
                  has fenced (evacuation).
                items:
                  type: string
                type: array
              lease:
                description: Lease is the broker heartbeat; a stale RenewTime drives
                  Phase to Unknown.
                properties:
                  holderIdentity:
                    description: HolderIdentity is the broker instance currently reporting
                      for this pool.
                    type: string
                  renewTime:
                    description: RenewTime is when the holder last renewed the lease.
                    format: date-time
                    type: string
                type: object
              nodeDrain:
                description: |-
                  NodeDrain reports, per fenced /64, whether the returning broker has confirmed
                  its stale VMIs are terminated (safe to release the fence).
                items:
                  description: NodeDrainStatus is the per-/64 drain confirmation used
                    to gate fence release.
                  properties:
                    drained:
                      description: Drained is true once the broker confirms the /64's
                        stale VMIs are gone.
                      type: boolean
                    prefix:
                      description: Prefix is the node /64 underlay prefix.
                      type: string
                  required:
                  - prefix
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - prefix
                x-kubernetes-list-type: map
              nodePrefixes:
