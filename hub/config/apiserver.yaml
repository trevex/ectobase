#
# The central aggregated apiserver (platform.ectobase.dev). It stores objects in
# kine (--etcd-servers=http://kine:2379) and self-generates a self-signed
# serving cert on startup (apiserver-kit calls MaybeDefaultWithSelfSignedCerts
# into --cert-dir, an emptyDir here). Delegated authn/authz uses the pod's
# ServiceAccount (in-cluster config) — see the RBAC below binding it to the
# system:auth-delegator role and granting access to the extension-apiserver
# authentication configmap.
#
# NOTE (dev/smoke only): the APIService (apiservice.yaml) uses
# insecureSkipTLSVerify because the serving cert is self-signed and ephemeral.
# Production must inject a caBundle (e.g. cert-manager CA injection or a
# controller that syncs the generated CA into the APIService) instead.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: central-apiserver
  namespace: system
---
# Allow the aggregated apiserver to delegate authn/authz to the host kube-apiserver.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: central-apiserver-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: central-apiserver
    namespace: system
---
# The generic apiserver runs admission (ValidatingAdmissionPolicy, webhooks) and
# APIPriorityAndFairness informers that list cluster-scoped resources on startup;
# without read access those reflectors error and /readyz never passes. For the
# dev/smoke manifest we grant cluster-admin. Production should scope this down to
# the specific admission/flowcontrol/webhook resources the server actually reads.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: central-apiserver-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: central-apiserver
    namespace: system
---
# Access to the extension-apiserver-authentication configmap in kube-system,
# which carries the requestheader/client CA the aggregation layer needs.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: central-apiserver-extension-auth-reader
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: central-apiserver
    namespace: system
---
apiVersion: v1
kind: Service
metadata:
  name: apiserver-service
  namespace: system
spec:
  selector:
    app: central-apiserver
  ports:
    - name: https
      port: 443
      targetPort: 6443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: central-apiserver
  namespace: system
  labels:
    app: central-apiserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: central-apiserver
  template:
    metadata:
      labels:
        app: central-apiserver
    spec:
      serviceAccountName: central-apiserver
      containers:
        - name: apiserver
          image: ghcr.io/trevex/ectobase/central-apiserver:dev
          args:
            - "--etcd-servers=http://kine:2379"
            - "--secure-port=6443"
            - "--cert-dir=/var/run/apiserver/certs"
            - "--audit-log-path=-"
            # The admission-policy plugins' informers watch alpha resources
            # (Mutating/ValidatingAdmissionPolicyBinding) that this host kube does
            # not serve, so informer-sync never completes and /readyz stays 500.
            # We serve no admission policies here, so disable those plugins.
            - "--disable-admission-plugins=MutatingAdmissionPolicy,ValidatingAdmissionPolicy"
          ports:
            - name: https
              containerPort: 6443
          volumeMounts:
            - name: cert-dir
              mountPath: /var/run/apiserver/certs
          readinessProbe:
            httpGet:
              path: /readyz
              port: 6443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: 6443
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: cert-dir
          emptyDir: {}
