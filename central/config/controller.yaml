#
# The central controller: a controller-runtime manager running the ClusterPool
# reconciler against the aggregated apiserver (via in-cluster config). It needs
# RBAC to watch/get/list ClusterPools and update their status subresource.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: central-controller
  namespace: system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: central-controller
rules:
  - apiGroups: ["platform.ectobase.dev"]
    resources: ["clusterpools"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["platform.ectobase.dev"]
    resources: ["clusterpools/status"]
    verbs: ["get", "update", "patch"]
  # The scheduler watches VirtualMachines and binds spec.clusterName; the failover controller
  # re-binds them + reads compiled/volume state during drain. Without these the scheduler's
  # VirtualMachine informer is forbidden -> cache never syncs -> the manager stalls and NO
  # reconciler (incl. pool-health that sets ClusterPool phase) runs.
  - apiGroups: ["net.ectobase.dev"]
    resources: ["virtualmachines", "compiledvms", "compilednics", "compiledvolumeattachments", "volumes"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["net.ectobase.dev"]
    resources: ["virtualmachines/status", "compiledvms/status"]
    verbs: ["get", "update", "patch"]
  # The StorageFencer creates/deletes csi-addons NetworkFence CRs to blocklist a lost pool's /64.
  - apiGroups: ["csiaddons.openshift.io"]
    resources: ["networkfences"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: central-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: central-controller
subjects:
  - kind: ServiceAccount
    name: central-controller
    namespace: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: central-controller
  namespace: system
  labels:
    app: central-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: central-controller
  template:
    metadata:
      labels:
        app: central-controller
    spec:
      serviceAccountName: central-controller
      containers:
        - name: controller
          image: ghcr.io/trevex/ectobase/central-controller:dev
          args:
            - "-reflector-admin=[fd00:db8:0:1::1]:1338"
            - "-csi-driver=rbd.csi.ceph.com"
            # The ceph fsid (clusterID) is per-deploy (the lab ceph deploy emits it), so it cannot be
            # baked in; the tier2 live deploy patches this arg with the real fsid. Empty here =>
            # NetworkFence spec.parameters.clusterID omitted => the ceph-csi driver rejects the fence
            # ("missing or empty clusterID"). MUST be set to the fsid for the storage fence to succeed.
            - "-csi-cluster-id="
            - "-csi-secret-name=csi-rbd-secret"
            - "-csi-secret-namespace=ceph-csi"
          env:
            # client-go's WatchListClient uses SendInitialEvents=true streaming
            # list-watches that this aggregated apiserver (older apiserver libs)
            # does not support, leaving the informer stuck with no initial LIST
            # (workers start but no events ever arrive). Disable it so the cache
            # falls back to a plain LIST+WATCH.
            - name: KUBE_FEATURE_WatchListClient
              value: "false"
