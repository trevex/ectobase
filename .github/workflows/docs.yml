name: docs

# Build the mkdocs-material site and publish it to GitHub Pages. Uses the SAME flake
# devShell as `make docs` (mkdocs build --strict), so CI renders the docs identically to
# local. The CRD API reference under docs/reference/api is generated by `make generate`
# and committed, so this job only renders committed sources — no controller-gen needed.
#
# REPO SETTING REQUIRED (one-time): Settings -> Pages -> Build and deployment ->
# Source = "GitHub Actions". Without it the deploy step has nowhere to publish.

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  workflow_dispatch:

# Allow the deploy job to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight Pages deploy at a time; don't cancel a running deploy (it would leave
# Pages half-published), just queue the next.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build docs (mkdocs build --strict)
        run: nix develop --command make docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
