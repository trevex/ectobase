name: docker

# Build and publish the flowplane container image:
#   * flowplane       (Dockerfile)     -> the eBPF datapath binary
#
# Each image is tagged the same way:
#   * every push to main  -> tagged with the short commit SHA (e.g. d76a033)
#   * every pushed tag    -> tagged with the tag name (e.g. v1.2.3)
on:
  push:
    branches: [main]
    tags: ['*']

concurrency:
  # Cancel an in-flight build for the same ref when a newer commit lands.
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: flowplane,      dockerfile: Dockerfile }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            # main pushes: the bare short SHA, plus the moving `main` tag
            type=sha,prefix=,format=short,enable={{is_default_branch}}
            type=ref,event=branch,enable={{is_default_branch}}
            # tag pushes: the literal git tag name
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The image self-builds a heavy toolchain + release Rust build (LLVM 21 + bpf-linker),
          # so reuse layers across runs via the GitHub Actions cache. Scope the cache per image
          # in case additional matrix legs are added later.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
