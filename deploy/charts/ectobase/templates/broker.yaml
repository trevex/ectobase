{{- if .Values.broker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub-broker
  namespace: ectobase-system
  labels:
    app.kubernetes.io/name: hub-broker
    app.kubernetes.io/part-of: netplane
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hub-broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hub-broker
        app.kubernetes.io/part-of: netplane
    spec:
      serviceAccountName: hub-broker
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - operator: Exists
      containers:
        - name: broker
          image: {{ .Values.images.hubBroker }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["broker"]
          args:
            - "--cluster-name={{ .Values.broker.clusterName }}"
            - "--hub-kubeconfig=/secrets/hub/kubeconfig"
          volumeMounts:
            - name: hub-kubeconfig
              mountPath: /secrets/hub
              readOnly: true
      volumes:
        - name: hub-kubeconfig
          secret:
            secretName: {{ .Values.broker.hubKubeconfigSecret }}
{{- end }}
