syntax = "proto3";

package dataplane.v1;

option go_package = "github.com/trevex/xdp-dp/cni/gen/dataplanev1;dataplanev1";

// DataplaneNode is the node-local API the CNI calls to wire a VM's interface
// into the eBPF dataplane. Purpose-built for this platform (not dpservice).
service DataplaneNode {
  rpc AttachInterface(AttachInterfaceRequest) returns (AttachInterfaceResponse);
  rpc DetachInterface(DetachInterfaceRequest) returns (DetachInterfaceResponse);
  rpc ConfigureNetwork(ConfigureNetworkRequest) returns (ConfigureNetworkResponse);
  // AddRoute programs a single overlay route (vni, prefix -> nexthop underlay).
  // Idempotent: re-adding an existing (vni, prefix) replaces its nexthop.
  rpc AddRoute(AddRouteRequest) returns (AddRouteResponse);
  // WithdrawRoute removes an overlay route. Removing an absent route is not an error.
  rpc WithdrawRoute(WithdrawRouteRequest) returns (WithdrawRouteResponse);
  // AddNatSource programs egress SNAT for a source (vni, source_ip) onto a
  // deterministic (nat_ip, [port_min, port_max]) block. Idempotent-ish: re-adding
  // an existing source replaces its block.
  rpc AddNatSource(AddNatSourceRequest) returns (AddNatSourceResponse);
  // WithdrawNatSource removes a source's SNAT. Removing an absent source is not an error.
  rpc WithdrawNatSource(WithdrawNatSourceRequest) returns (WithdrawNatSourceResponse);
  // AddNeighborNat programs a return-to-owner entry: return traffic to
  // (nat_ip, [port_min, port_max]) is re-forwarded to owner_underlay.
  rpc AddNeighborNat(AddNeighborNatRequest) returns (AddNeighborNatResponse);
  // WithdrawNeighborNat removes a return-to-owner entry. Removing an absent one is not an error.
  rpc WithdrawNeighborNat(WithdrawNeighborNatRequest) returns (WithdrawNeighborNatResponse);
}

message AttachInterfaceRequest {
  string interface_id = 1; // stable id (e.g. VMI uid + iface name)
  string netns_path = 2;   // target network namespace path
  uint32 vni = 3;
  string mac = 4;          // optional; allocated if empty
  repeated string requested_ips = 5; // optional; allocated if empty
}
message AttachInterfaceResponse {
  string ifname = 1;
  repeated string ips = 2;
  string mac = 3;
  string gateway = 4;
  string underlay_route = 5; // allocated underlay /128 the overlay encaps to
}

message DetachInterfaceRequest { string interface_id = 1; }
message DetachInterfaceResponse {}

message ConfigureNetworkRequest {
  uint32 vni = 1;
  string gateway = 2;
  uint32 mtu = 3;
  repeated string dns = 4;
}
message ConfigureNetworkResponse {}

message AddRouteRequest {
  uint32 vni = 1;
  string prefix = 2;           // CIDR: "10.0.0.5/32" or "2001:db8::5/128"
  string nexthop_underlay = 3; // remote node underlay IPv6, e.g. "fd00:db8:0:2::a"
  bool external = 4;           // if set, matching source traffic egress-SNATs (e.g. an external default route)
}
message AddRouteResponse {}

message WithdrawRouteRequest {
  uint32 vni = 1;
  string prefix = 2;           // CIDR, as in AddRouteRequest
}
message WithdrawRouteResponse {}

message AddNatSourceRequest {
  uint32 vni = 1;
  string source_ip = 2; // overlay IPv4 of the source (a NetworkInterface IP)
  string nat_ip = 3;    // public IPv4 the source is SNATed onto
  uint32 port_min = 4;  // inclusive
  uint32 port_max = 5;  // exclusive
}
message AddNatSourceResponse {}

message WithdrawNatSourceRequest {
  uint32 vni = 1;
  string source_ip = 2; // overlay IPv4 of the source
}
message WithdrawNatSourceResponse {}

message AddNeighborNatRequest {
  string nat_ip = 1;         // public IPv4 whose return block this entry owns
  uint32 port_min = 2;       // inclusive
  uint32 port_max = 3;       // exclusive
  string owner_underlay = 4; // owner node underlay IPv6 return traffic is forwarded to
  uint32 vni = 5;
}
message AddNeighborNatResponse {}

message WithdrawNeighborNatRequest {
  string nat_ip = 1;
  uint32 port_min = 2;
  uint32 port_max = 3;
  uint32 vni = 4;
}
message WithdrawNeighborNatResponse {}
