syntax = "proto3";

package routebus.v1;

option go_package = "github.com/trevex/ectobase/mesh/gen/routebusv1;routebusv1";

// RouteBus is the control-plane route exchange between per-node agents and the
// central reflector. One long-lived bidi stream per agent.
service RouteBus {
  rpc Session(stream ClientMsg) returns (stream ServerMsg);
}

// RouteBusAdmin lets central set/clear per-/64 route fences on the reflector.
service RouteBusAdmin {
  rpc SetFence(FenceRequest) returns (FenceReply);
  rpc ClearFence(FenceRequest) returns (FenceReply);
}

message FenceRequest {
  string prefix = 1; // node /64, e.g. "2001:db8:0:1::/64"
}

message FenceReply {}

enum RouteOp {
  ROUTE_OP_UNSPECIFIED = 0;
  ROUTE_OP_ADD = 1;
  ROUTE_OP_WITHDRAW = 2;
}

enum PublicKind {
  PUBLIC_KIND_UNSPECIFIED = 0;
  PUBLIC_KIND_EDGE_UNDERLAY = 1;   // edge anycast datapath /128; owner_underlay = edge's UNIQUE loopback
  PUBLIC_KIND_NAT_IP = 2;          // distributed-SNAT nat_ip block (port_min/max = the block)
  // A backed LB address: announced by each BACKEND node, one record per (LB address, backend NIC). It
  // carries both halves the edge needs — the LB address + its service `ports` (for AddLoadBalancer) and the
  // backend's owner_underlay/overlay_ip/vni (for AddLbBackend) — so the edge programs the whole
  // load balancer from backend announcements alone, with no API server of its own.
  PUBLIC_KIND_LB_IP = 3;
  PUBLIC_KIND_FLOATING_IP = 4;     // reserved
}

// PortProto is one LB service tuple. proto is the IP protocol NUMBER (6=TCP, 17=UDP).
message PortProto {
  uint32 port  = 1;
  uint32 proto = 2;
}

// Agent -> reflector.
message ClientMsg {
  oneof msg {
    Hello hello = 1;             // MUST be the first message on the stream
    Subscribe subscribe = 2;
    Unsubscribe unsubscribe = 3;
    Announce announce = 4;
    Withdraw withdraw = 5;
    KeepAlive keep_alive = 6;
    AnnounceNat announce_nat = 7;   // announce a deterministic egress NAT block (global, not per-VNI)
    WithdrawNat withdraw_nat = 8;
    PublicPrefix announce_public = 9;
    PublicPrefix withdraw_public = 10;
  }
}

// Reflector -> agent.
message ServerMsg {
  oneof msg {
    RouteUpdate route_update = 1;
    EndOfRIB end_of_rib = 2;     // full-table-for-a-vni delivered; safe to prune
    KeepAlive keep_alive = 3;
    NatUpdate nat_update = 4;     // a global NAT block was announced/withdrawn
    PublicUpdate public_update = 5;
    EndOfGlobal end_of_global = 6; // global (NAT + public) snapshot delivered; safe to prune
  }
}

message Hello {
  string node_id = 1;       // stable per-agent identity (== the reflector's origin key)
  string underlay_ipv6 = 2; // this node's underlay /128 (informational for v1)
  // Whether this session receives the GLOBAL channel — NAT blocks and public records: the
  // snapshot on Hello and every later delta. Only a WAN edge consumes it (it relays NAT returns to
  // their owners and runs Maglev for LB addresses), so a compute node opts out, which removes the
  // O(records × nodes) fanout. The default, ALL, keeps an older agent working unchanged.
  GlobalFeed global_feed = 3;
}

enum GlobalFeed {
  GLOBAL_FEED_ALL = 0;
  // No global records. The session still receives EndOfGlobal{record_count: 0}, so a consumer that
  // waits for the global snapshot (convergence) completes, and prunes against an empty set.
  GLOBAL_FEED_NONE = 1;
}
message Subscribe { uint32 vni = 1; }
message Unsubscribe { uint32 vni = 1; }

message Announce {
  uint32 vni = 1;
  string prefix = 2;             // CIDR overlay prefix, e.g. "10.0.0.5/32"
  string nexthop_underlay = 3;   // primary nexthop = this node's underlay IPv6
  repeated string extra_nexthops = 4; // additional ECMP nexthops (carried, not yet used)
  bool external = 5;             // if set, matching source traffic egress-SNATs (e.g. an external default route)
}
message Withdraw {
  uint32 vni = 1;
  string prefix = 2;
}

message RouteUpdate {
  uint32 vni = 1;
  string prefix = 2;
  repeated string nexthops = 3;  // nexthops[0] is the primary; rest are ECMP
  RouteOp op = 4;
  bool external = 5;             // if set, matching source traffic egress-SNATs (e.g. an external default route)
}
// EndOfRIB marks the end of one VNI's replayed table: the prune trigger for its routes.
//
// record_count is how many routes were replayed before this marker, and is used exactly as
// EndOfGlobal.record_count is — the consumer prunes only if it received that many, because an
// older reflector's sink dropped snapshot records on overflow, and pruning against a lossy
// snapshot withdraws LIVE routes. The reflector hands the replay and this marker to the session as
// one snapshot while the RIB lock is held, and never drops a snapshot, so a concurrent fanout
// cannot interleave or inflate the count.
message EndOfRIB {
  uint32 vni = 1;
  uint32 record_count = 2;
}

// EndOfGlobal marks the end of the GLOBAL (non-per-VNI) snapshot: the NAT blocks and
// PublicPrefix records a session is replayed when it registers. It is the prune trigger for
// those channels — the counterpart to EndOfRIB for a VNI's routes. Without it a record
// WITHDRAWN while a consumer was disconnected was simply absent from the replayed snapshot and
// its dataplane entry lingered forever: Maglev kept hashing a share of flows to a backend that
// no longer exists, and neighbor-NAT kept a return route to a block that moved.
//
// record_count is how many global records the reflector sent before this marker. The consumer
// prunes ONLY if it received exactly that many. The reflector queues a snapshot whole (only live
// deltas to a consumer that has fallen far behind are dropped), but an older reflector dropped
// snapshot records on overflow, and pruning against a lossy snapshot would withdraw LIVE state —
// strictly worse than the staleness being fixed; counting turns such a replay into a safe no-op
// that retries on the next reconnect. The replay and this marker are handed over as one snapshot
// while the RIB lock is held, so concurrent fanout deltas land after it and cannot inflate the
// count.
message EndOfGlobal { uint32 record_count = 1; }

message KeepAlive {}

// AnnounceNat announces this node's ownership of a deterministic egress SNAT
// block: overlay source_ip (in vni) is SNATed onto nat_ip:[port_min,port_max)
// and the owning node's underlay is owner_underlay. Every node announces its own blocks; they are
// fanned out on the GLOBAL channel (not per-VNI), so every session that TAKES that feed — only WAN
// edges do (see Hello.global_feed) — learns every block and re-routes a return that lands on it.
message AnnounceNat {
  uint32 vni = 1;
  string source_ip = 2;
  string nat_ip = 3;
  uint32 port_min = 4;
  uint32 port_max = 5;
  string owner_underlay = 6;
}
message WithdrawNat {
  string nat_ip = 1;
  uint32 port_min = 2;
  uint32 port_max = 3;
}
message NatUpdate {
  uint32 vni = 1;
  string source_ip = 2;
  string nat_ip = 3;
  uint32 port_min = 4;
  uint32 port_max = 5;
  string owner_underlay = 6;
  RouteOp op = 7;
}

message PublicPrefix {
  PublicKind kind           = 1;
  string     prefix         = 2;
  string     owner_underlay = 3;
  uint32     vni            = 4;
  uint32     port_min       = 5;
  uint32     port_max       = 6;
  string     overlay_ip     = 7;  // LB_IP: the backend guest's overlay IP (for AddLbBackend)
  // LB_IP: the load balancer's service tuples, so a bus-only edge can AddLoadBalancer before it
  // AddLbBackends. Every backend of one LB address announces the same set; the edge keys on the LB address.
  repeated PortProto ports  = 8;
}
message PublicUpdate { PublicPrefix prefix = 1; RouteOp op = 2; }
