syntax = "proto3";

package routebus.v1;

option go_package = "github.com/trevex/ectobase/mesh/gen/routebusv1;routebusv1";

// RouteBus is the control-plane route exchange between per-node agents and the
// central reflector. One long-lived bidi stream per agent.
service RouteBus {
  rpc Session(stream ClientMsg) returns (stream ServerMsg);
}

// RouteBusAdmin lets central set/clear per-/64 route fences on the reflector.
service RouteBusAdmin {
  rpc SetFence(FenceRequest) returns (FenceReply);
  rpc ClearFence(FenceRequest) returns (FenceReply);
}

message FenceRequest {
  string prefix = 1; // node /64, e.g. "2001:db8:0:1::/64"
}

message FenceReply {}

enum RouteOp {
  ROUTE_OP_UNSPECIFIED = 0;
  ROUTE_OP_ADD = 1;
  ROUTE_OP_WITHDRAW = 2;
}

enum PublicKind {
  PUBLIC_KIND_UNSPECIFIED = 0;
  PUBLIC_KIND_EDGE_UNDERLAY = 1;   // edge anycast datapath /128; owner_underlay = edge's UNIQUE loopback
  PUBLIC_KIND_NAT_IP = 2;          // distributed-SNAT nat_ip block (port_min/max = the block)
  PUBLIC_KIND_LB_VIP = 3;          // reserved (external LB arc)
  PUBLIC_KIND_FLOATING_IP = 4;     // reserved
}

// Agent -> reflector.
message ClientMsg {
  oneof msg {
    Hello hello = 1;             // MUST be the first message on the stream
    Subscribe subscribe = 2;
    Unsubscribe unsubscribe = 3;
    Announce announce = 4;
    Withdraw withdraw = 5;
    KeepAlive keep_alive = 6;
    AnnounceNat announce_nat = 7;   // announce a deterministic egress NAT block (global, not per-VNI)
    WithdrawNat withdraw_nat = 8;
    PublicPrefix announce_public = 9;
    PublicPrefix withdraw_public = 10;
  }
}

// Reflector -> agent.
message ServerMsg {
  oneof msg {
    RouteUpdate route_update = 1;
    EndOfRIB end_of_rib = 2;     // full-table-for-a-vni delivered; safe to prune
    KeepAlive keep_alive = 3;
    NatUpdate nat_update = 4;     // a global NAT block was announced/withdrawn
    PublicUpdate public_update = 5;
  }
}

message Hello {
  string node_id = 1;       // stable per-agent identity (== the reflector's origin key)
  string underlay_ipv6 = 2; // this node's underlay /128 (informational for v1)
}
message Subscribe { uint32 vni = 1; }
message Unsubscribe { uint32 vni = 1; }

message Announce {
  uint32 vni = 1;
  string prefix = 2;             // CIDR overlay prefix, e.g. "10.0.0.5/32"
  string nexthop_underlay = 3;   // primary nexthop = this node's underlay IPv6
  repeated string extra_nexthops = 4; // additional ECMP nexthops (carried, not yet used)
  bool external = 5;             // if set, matching source traffic egress-SNATs (e.g. an external default route)
}
message Withdraw {
  uint32 vni = 1;
  string prefix = 2;
}

message RouteUpdate {
  uint32 vni = 1;
  string prefix = 2;
  repeated string nexthops = 3;  // nexthops[0] is the primary; rest are ECMP
  RouteOp op = 4;
  bool external = 5;             // if set, matching source traffic egress-SNATs (e.g. an external default route)
}
message EndOfRIB { uint32 vni = 1; }
message KeepAlive {}

// AnnounceNat announces this node's ownership of a deterministic egress SNAT
// block: overlay source_ip (in vni) is SNATed onto nat_ip:[port_min,port_max)
// and the owning node's underlay is owner_underlay. NAT blocks are GLOBAL: every
// node learns every block so a return that lands on the wrong node re-routes.
message AnnounceNat {
  uint32 vni = 1;
  string source_ip = 2;
  string nat_ip = 3;
  uint32 port_min = 4;
  uint32 port_max = 5;
  string owner_underlay = 6;
}
message WithdrawNat {
  string nat_ip = 1;
  uint32 port_min = 2;
  uint32 port_max = 3;
}
message NatUpdate {
  uint32 vni = 1;
  string source_ip = 2;
  string nat_ip = 3;
  uint32 port_min = 4;
  uint32 port_max = 5;
  string owner_underlay = 6;
  RouteOp op = 7;
}

message PublicPrefix {
  PublicKind kind           = 1;
  string     prefix         = 2;
  string     owner_underlay = 3;
  uint32     vni            = 4;
  uint32     port_min       = 5;
  uint32     port_max       = 6;
}
message PublicUpdate { PublicPrefix prefix = 1; RouteOp op = 2; }
