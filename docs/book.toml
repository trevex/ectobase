[book]
title = "ectobase networking"
description = "Durable documentation for the ectobase eBPF dataplane (flowplane) and control plane (netplane)."
authors = ["ectobase contributors"]
language = "en"
src = "src"

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/trevex/ectobase"
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.fold]
enable = true
level = 1
