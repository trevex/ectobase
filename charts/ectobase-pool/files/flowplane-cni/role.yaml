---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flowplane-cni
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
- apiGroups:
  - compiled.ectobase.dev
  resources:
  - compilednics
  verbs:
  - get
  # list: a KubeVirt virt-launcher pod carries no net.ectobase.dev/network-interface annotation, so
  # the CNI resolves its NIC by matching the interface MAC against CompiledNIC.Spec.MAC (namespace
  # list). See cni/plugin/resolve.go resolveCompiledNICByMAC.
  - list
