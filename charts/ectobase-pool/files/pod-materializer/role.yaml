---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-materializer
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - compiled.ectobase.dev
  resources:
  - compiledcontainers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - compiled.ectobase.dev
  resources:
  - compiledcontainers/status
  verbs:
  - get
  - patch
  - update
