---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: netplane-agent
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - compiled.ectobase.dev
  resources:
  - compilednics
  - compilednics/status
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - net.ectobase.dev
  resources:
  - loadbalancers
  - loadbalancers/status
  - natgateways
  - natgateways/status
  - networkinterfaces
  - vpcs
  - vpcs/status
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - net.ectobase.dev
  resources:
  - networkinterfaces/status
  verbs:
  - get
  - list
  - patch
  - update
  - watch
