---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mesh-agent
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cert-manager.io
  resources:
  - certificates
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - compiled.ectobase.dev
  resources:
  - compilednics
  - compilednics/status
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - net.ectobase.dev
  resources:
  - loadbalancers
  - loadbalancers/status
  verbs:
  - get
  - list
  - watch
