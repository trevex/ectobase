---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: ippools.net.ectobase.dev
spec:
  group: net.ectobase.dev
  names:
    kind: IPPool
    listKind: IPPoolList
    plural: ippools
    singular: ippool
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          IPPool is a fleet-scoped, typed range of IPv4/IPv6 prefixes that any consumer
          (LoadBalancer, NATGateway, ...) allocates addresses from.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: IPPoolSpec is the desired state of an IPPool (a fleet-scoped
              address range).
            properties:
              reservedIPs:
                description: ReservedIPs are addresses held back from allocation within
                  this pool.
                items:
                  type: string
                type: array
              type:
                description: Type is what the addresses in this pool are for.
                enum:
                - public
                - internal
                type: string
              v4Prefix:
                description: V4Prefix optionally pins the IPv4 CIDR for this pool.
                type: string
              v6Prefix:
                description: V6Prefix optionally pins the IPv6 CIDR for this pool.
                type: string
            required:
            - type
            type: object
          status:
            description: IPPoolStatus is the observed state of an IPPool.
            properties:
              allocated:
                description: |-
                  Allocated is how many IPAllocations currently name this pool. A convenience for
                  operators, derived on each sync — never the source of truth for what is free.
                format: int32
                type: integer
              state:
                description: 'State is the current lifecycle state: Pending, Ready,
                  Invalid or Conflict.'
                type: string
              total:
                description: Total is the number of allocatable addresses across this
                  pool's prefixes.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
