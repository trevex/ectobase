kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: vpcs.net.ectobase.dev
spec:
  group: net.ectobase.dev
  names:
    kind: VPC
    listKind: VPCList
    plural: vpcs
    singular: vpc
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: VPC is an isolation domain (overlay network) identified by a
          VNI on the shared underlay.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: VPCSpec is the desired state of a VPC (an isolation domain
              / overlay network).
            properties:
              defaultPolicy:
                description: |-
                  DefaultPolicy sets what happens to traffic no firewall rule matches. Allow: it passes (rules
                  carve out denies). Deny: it drops, in every direction (rules carve out allows). Unset keeps
                  Kubernetes NetworkPolicy semantics per direction: a direction no policy governs is open, a
                  governed direction admits only what its rules allow. The VPC's FirewallDefault condition
                  reports the posture in effect.
                enum:
