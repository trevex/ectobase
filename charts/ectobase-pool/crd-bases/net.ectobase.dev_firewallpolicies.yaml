---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: firewallpolicies.net.ectobase.dev
spec:
  group: net.ectobase.dev
  names:
    kind: FirewallPolicy
    listKind: FirewallPolicyList
    plural: firewallpolicies
    shortNames:
    - fwpol
    singular: firewallpolicy
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          FirewallPolicy is a set of prioritized allow/deny rules applied to the NetworkInterfaces its
          selector matches; the distributed firewall enforces it per interface in the datapath.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: FirewallPolicySpec is the desired state of a FirewallPolicy.
            properties:
              egress:
                description: Egress is the ordered list of egress rules to apply to
                  selected interfaces.
                items:
                  description: FirewallPolicyRule is a single allow/deny rule for
                    ingress or egress traffic.
                  properties:
                    action:
                      description: Action is "Allow" or "Deny".
                      enum:
                      - Allow
                      - Deny
                      type: string
                    cidr:
                      description: |-
                        CIDR is the source (ingress) or destination (egress) CIDR to match.
                        "0.0.0.0/0" matches all IPv4 addresses, "::/0" all IPv6 addresses.
                      type: string
                    port:
                      description: Port is the destination port to match (0 = any).
                        Requires Proto TCP or UDP.
                      format: int32
                      maximum: 65535
                      minimum: 0
                      type: integer
                    priority:
                      description: |-
                        Priority orders this rule against the other rules of equally-prioritized policies: lower
                        wins. 0-65535; unset means 32768. Rules of equal priority keep their list order.
                      format: int32
                      maximum: 65535
                      minimum: 0
                      type: integer
                    proto:
                      description: |-
                        Proto is the IP protocol to match ("TCP", "UDP", "ICMP", or "" for any). ICMP means the ICMP
                        of the CIDR's family (ICMPv6 for an IPv6 CIDR).
                      enum:
                      - TCP
                      - UDP
                      - ICMP
                      type: string
                  required:
                  - action
                  - cidr
                  type: object
                type: array
              ingress:
                description: Ingress is the ordered list of ingress rules to apply
                  to selected interfaces.
                items:
                  description: FirewallPolicyRule is a single allow/deny rule for
                    ingress or egress traffic.
                  properties:
                    action:
                      description: Action is "Allow" or "Deny".
                      enum:
                      - Allow
                      - Deny
                      type: string
                    cidr:
                      description: |-
                        CIDR is the source (ingress) or destination (egress) CIDR to match.
                        "0.0.0.0/0" matches all IPv4 addresses, "::/0" all IPv6 addresses.
                      type: string
                    port:
                      description: Port is the destination port to match (0 = any).
                        Requires Proto TCP or UDP.
                      format: int32
                      maximum: 65535
                      minimum: 0
                      type: integer
                    priority:
                      description: |-
                        Priority orders this rule against the other rules of equally-prioritized policies: lower
                        wins. 0-65535; unset means 32768. Rules of equal priority keep their list order.
                      format: int32
                      maximum: 65535
                      minimum: 0
                      type: integer
                    proto:
                      description: |-
                        Proto is the IP protocol to match ("TCP", "UDP", "ICMP", or "" for any). ICMP means the ICMP
                        of the CIDR's family (ICMPv6 for an IPv6 CIDR).
                      enum:
                      - TCP
                      - UDP
                      - ICMP
                      type: string
                  required:
                  - action
                  - cidr
                  type: object
                type: array
              interfaceSelector:
                description: InterfaceSelector selects the NetworkInterfaces this
                  policy applies to via label matching.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              priority:
                description: |-
                  Priority orders this policy against the other policies selecting the same interface: lower
                  wins. 0-65535; unset means 32768. Policies of equal priority are ordered by their rules'
                  priorities, then by policy name.
                format: int32
                maximum: 65535
                minimum: 0
                type: integer
            type: object
          status:
            description: |-
              FirewallPolicyStatus is the observed state of a FirewallPolicy. Intentionally empty: the outcome
              of compiling a policy is reported per interface, on the NetworkInterface's FirewallCompiled
              condition.
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
