---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: ipallocations.net.ectobase.dev
spec:
  group: net.ectobase.dev
  names:
    kind: IPAllocation
    listKind: IPAllocationList
    plural: ipallocations
    singular: ipallocation
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          IPAllocation is one address held out of one IPPool. It is created by the consumer's
          allocator and reclaimed by Kubernetes garbage collection when its ownerReference's
          consumer is deleted.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              IPAllocationSpec is the desired state of an IPAllocation.

              There is no status: the object's EXISTENCE is the state. Its name is derived from
              (pool, address) and object names are unique within a namespace, which makes Create a
              compare-and-swap — two allocators racing for one address cannot both succeed, without
              either of them assuming it is the only writer.
            properties:
              address:
                description: Address is the allocated address, canonical form.
                type: string
              consumerRef:
                description: |-
                  ConsumerRef records who asked for it, for humans and diagnostics. The authoritative
                  lifetime link is the ownerReference, not this field.
                properties:
                  kind:
                    description: Kind is the kind of the referenced object.
                    type: string
                  name:
                    description: Name is the name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              poolRef:
                description: PoolRef is the IPPool this address came from.
                properties:
                  name:
                    description: Name is the name of the referenced object.
                    type: string
                required:
                - name
                type: object
            required:
            - address
            - consumerRef
            - poolRef
            type: object
        type: object
    served: true
    storage: true
