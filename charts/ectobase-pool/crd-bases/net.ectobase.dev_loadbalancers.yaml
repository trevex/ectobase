---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: loadbalancers.net.ectobase.dev
spec:
  group: net.ectobase.dev
  names:
    kind: LoadBalancer
    listKind: LoadBalancerList
    plural: loadbalancers
    singular: loadbalancer
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: LoadBalancer is a scaffold-only resource. Selector-target load
          balancer (§3.5).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              LoadBalancerSpec is the desired state of a LoadBalancer. The IP is the LB's identity (v4 or v6);
              backends are the NetworkInterfaces matched by TargetSelector or named by TargetRefs.

              Deliberately NOT called a "LB address". A load-balancer address is 1:N and ingress-only — clients reach
              it and it Maglev-hashes to a backend, but a backend's own egress is SNATed to its NATGateway
              address, never to this one. The 1:1, bidirectional "virtual IP" that a single interface owns for
              both directions (ironcore/dpservice VirtualIP, AWS Elastic IP) is a different object: FloatingIP.
              Naming both "LB address" conflated them once too often.
            properties:
              ip:
                description: |-
                  IP is the requested load-balancer address. Empty => allocate from PoolRef; set =>
                  validate membership in the pool + reserve (bring-your-own).
                type: string
              poolRef:
                description: PoolRef selects the LBPool to allocate the IP from.
                properties:
                  name:
                    description: Name is the name of the referenced object.
                    type: string
                required:
                - name
                type: object
              ports:
                description: Ports are the LB service (port, proto) tuples.
                items:
                  description: LoadBalancerPort is one LB service tuple.
                  properties:
                    port:
                      description: Port is the service port.
                      format: int32
                      type: integer
                    proto:
                      description: Proto is the IP protocol ("TCP" or "UDP").
                      type: string
                  required:
                  - port
                  - proto
                  type: object
                type: array
              targetRefs:
                description: TargetRefs names backend NetworkInterfaces explicitly.
                  Mutually exclusive with TargetSelector.
                items:
                  description: LocalObjectReference references an object by name within
                    the same namespace.
                  properties:
                    name:
                      description: Name is the name of the referenced object.
                      type: string
                  required:
                  - name
                  type: object
                type: array
              targetSelector:
                description: TargetSelector selects backend NetworkInterfaces by label.
                  Mutually exclusive with TargetRefs.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
            required:
            - ip
            - ports
            type: object
          status:
            description: LoadBalancerStatus is the observed state of a LoadBalancer.
            properties:
              allocatedIP:
                description: |-
                  AllocatedIP is the authoritative address assigned by the LB address allocator. Mirrors
                  NetworkInterface.status.allocatedIPs: spec is the request, status is the truth.
                type: string
              observedGeneration:
                description: ObservedGeneration is the Spec generation the allocation
                  reflects.
                format: int64
                type: integer
              state:
                description: State is the lifecycle state (Pending | Ready).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
