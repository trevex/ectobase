---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: compiledvms.compiled.ectobase.dev
spec:
  group: compiled.ectobase.dev
  names:
    kind: CompiledVM
    listKind: CompiledVMList
    plural: compiledvms
    singular: compiledvm
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: CompiledVM is the lowered boot intent for a scheduled VirtualMachine.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              CompiledVMSpec is the fully lowered, ready-to-materialize boot intent for a VM:
              the containerDisk image, compute resources, run strategy, the cluster binding,
              and the per-interface MAC + overlay network name. A downstream materializer
              turns this into a kubevirt.io/v1.VirtualMachine.
            properties:
              cloudInit:
                description: CloudInit, if set, is guest bootstrap delivered as a
                  cloud-init NoCloud datasource.
                properties:
                  userData:
                    description: 'UserData is the cloud-init user-data (commonly a
                      #cloud-config document).'
                    type: string
                type: object
              clusterName:
                description: |-
                  ClusterName is the cluster this compiled VM is bound to (the pod->node binding).
                  The per-cluster broker selects on this field.
                type: string
              image:
                description: Image is the containerDisk image to boot from.
                type: string
              interfaces:
                description: Interfaces are the VM's overlay interfaces (one per owned
                  NetworkInterface).
                items:
                  description: |-
                    CompiledVMInterface is a resolved overlay interface for a VM: the pinned MAC
                    and the multus network (NetworkAttachmentDefinition) name for the flowplane binding.
                  properties:
                    mac:
                      description: MAC is the pinned L2 address (from the NetworkInterface).
                      type: string
                    networkName:
                      description: NetworkName is the multus NetworkAttachmentDefinition
                        name for the overlay binding.
                      type: string
                  type: object
                type: array
              resources:
                description: Resources is the compute request/limit; maps to the KubeVirt
                  domain resources.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              runStrategy:
                description: RunStrategy is the KubeVirt run strategy (defaulted upstream
                  by the compiler).
                type: string
            type: object
          status:
            description: |-
              CompiledVMStatus is the observed state of a CompiledVM. It is intentionally
              minimal (State only): the downstream materializer reconciles CompiledVM into a
              KubeVirt VirtualMachine via declarative set-reconcile, so — unlike CompiledNIC,
              whose node agent tracks an applied generation — no GenerationApplied is needed here.
            properties:
              state:
                description: State is the materialization state (e.g. Applied, Pending).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
