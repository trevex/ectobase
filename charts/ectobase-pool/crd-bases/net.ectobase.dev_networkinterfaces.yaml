---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: networkinterfaces.net.ectobase.dev
spec:
  group: net.ectobase.dev
  names:
    kind: NetworkInterface
    listKind: NetworkInterfaceList
    plural: networkinterfaces
    singular: networkinterface
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: 'NetworkInterface is a thin NIC attached to a VM: identity plus
          user-specified overlay IPs.'
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NetworkInterfaceSpec is the desired state of a NetworkInterface
              (a thin NIC).
            properties:
              clusterName:
                description: |-
                  ClusterName is the compute cluster this standalone (e.g. Pod) NIC targets. The
                  compiler uses it for placement (CompiledNIC.spec.clusterName) when no
                  VirtualMachine owns this NIC; an owning VM's placement takes precedence.
                type: string
              ips:
                description: |-
                  IPs is the requested overlay set. Empty => the platform allocates from
                  the subnet. Populated => the requested IPs are validated for subnet
                  membership and uniqueness, then reserved (bring-your-own).
                items:
                  type: string
                type: array
              mac:
                description: |-
                  MAC is a bring-your-own L2 address request. Empty => the platform allocates
                  a stable, VPC-unique, locally-administered MAC into Status.AllocatedMAC.
                  Populated => the address is validated for format and VPC-uniqueness, then
                  reserved (a bad or clashing pin surfaces as Status.State=="Invalid"). The
                  authoritative value the datapath and the KubeVirt VMI use is always
                  Status.AllocatedMAC, never this field directly.
                type: string
              nodeName:
                description: NodeName is the node the interface is scheduled onto.
                  Set by the scheduler.
                type: string
              qos:
                description: QoS caps/shapes throughput for this interface. Nil =
                  unlimited.
                properties:
                  egress:
                    description: Egress shapes outbound (VM->out) throughput.
                    properties:
                      burstKB:
                        description: BurstKB is an optional burst allowance in KB.
                          Reserved (EDT ignores it in v1). 0 = default.
                        format: int32
                        type: integer
                      publicMbps:
                        description: PublicMbps caps external/NATed egress in Mbit/s
                          (policed). 0 = unlimited.
                        format: int32
                        type: integer
                      rateMbps:
                        description: RateMbps is the EDT-shaped total egress rate
                          in Mbit/s. 0 = unlimited.
                        format: int32
                        type: integer
                    type: object
                  ingress:
                    description: Ingress polices inbound (out->VM) throughput.
                    properties:
                      burstKB:
                        description: BurstKB is an optional burst allowance in KB.
                          Reserved (default burst in v1). 0 = default.
                        format: int32
                        type: integer
                      rateMbps:
                        description: RateMbps caps throughput in Mbit/s. 0 = unlimited.
                        format: int32
                        type: integer
                    type: object
                type: object
              subnetRef:
                description: |-
                  SubnetRef selects the Subnet to allocate from. Optional when the VPC has
                  exactly one Subnet, in which case that Subnet is used.
                properties:
                  name:
                    description: Name is the name of the referenced object.
                    type: string
                required:
                - name
                type: object
              vpcRef:
                description: VPCRef references the VPC this interface belongs to.
                properties:
                  name:
                    description: Name is the name of the referenced object.
                    type: string
                required:
                - name
                type: object
            required:
            - vpcRef
            type: object
          status:
            description: NetworkInterfaceStatus is the observed state of a NetworkInterface.
            properties:
              allocatedIPs:
                description: |-
                  AllocatedIPs is the authoritative overlay address set assigned by the IP
                  allocator. CompiledNIC.Spec.OverlayIPs is sourced from this, never Spec.IPs.
                items:
                  type: string
                type: array
              allocatedMAC:
                description: |-
                  AllocatedMAC is the authoritative L2 address assigned by the MAC allocator:
                  a stable, VPC-unique, locally-administered MAC derived from the NIC's UID
                  (or the pinned Spec.MAC). CompiledNIC.Spec.MAC is sourced from this, never
                  Spec.MAC. Empty until the interface reaches State=="Allocated".
                type: string
              conditions:
                description: |-
                  Conditions report compile-time observations about this interface. FirewallCompiled is False
                  when the policies selecting it cannot be programmed (e.g. over the per-interface rule
                  budget); the last good rule set then stays applied.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the Spec generation the allocation reflects. Compile
                  is gated on ObservedGeneration == metadata.generation.
                format: int64
                type: integer
              port:
                description: Port describes the dataplane port allocated for this
                  interface.
                properties:
                  name:
                    description: Name is the host-side interface name (e.g. dtapvf_0)
                      for tap ports.
                    type: string
                  pciAddress:
                    description: PCIAddress is the PCI address for vf ports.
                    type: string
                  type:
                    description: Type is the port type (e.g. tap or vf).
                    enum:
                    - tap
                    - vf
                    type: string
                type: object
              state:
                description: State is the current lifecycle state (e.g. Pending, Ready).
                type: string
              underlayRoute:
                description: |-
                  UnderlayRoute is the underlay address this interface is reached at: the host node's
                  single VTEP, shared by every interface on that node.
                type: string
              vni:
                description: VNI is the effective Geneve virtual network identifier
                  resolved from the VPC.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
