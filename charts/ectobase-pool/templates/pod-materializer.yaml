# Downstream pod-materializer: turns broker-synced CompiledContainer (local compiled.ectobase.dev)
# into a v1.Pod on this compute cluster, attached to the flowplane overlay via Multus + flowplane-cni.
# Runs ONLY on compute pools — the cluster where the container workload actually runs. Uses the
# in-cluster config (a normal pod: it talks to the local apiserver via the kubernetes ClusterIP and
# never touches the datapath, so no hostNetwork). SA + RBAC are in rbac.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-materializer
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: pod-materializer
    app.kubernetes.io/part-of: netplane
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pod-materializer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pod-materializer
        app.kubernetes.io/part-of: netplane
    spec:
      serviceAccountName: pod-materializer
      containers:
        - name: pod-materializer
          image: {{ .Values.images.netplane }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["pod-materializer"]
