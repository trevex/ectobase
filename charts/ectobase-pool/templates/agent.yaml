apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: netplane-agent
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: netplane-agent
    app.kubernetes.io/part-of: netplane
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: netplane-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netplane-agent
        app.kubernetes.io/part-of: netplane
    spec:
      serviceAccountName: netplane-agent
      # Run on every node, including control-plane (the fabric's cp node is a host too).
      tolerations:
        - operator: Exists
      # hostNetwork so the agent can reach the node-local flowplane on 127.0.0.1:1337.
      # ClusterFirstWithHostNet keeps in-cluster DNS working, so the reflector
      # Service name (reflector.ectobase-system.svc) still resolves.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: agent
          image: {{ .Values.images.netplane }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["agent"]
          # NOTE(tune): --underlay here is a fallback only. The reconciler announces
          # each endpoint's own status.underlayRoute (the /128 the attach path
          # allocated); --underlay is used only for interfaces not yet attached.
          args:
            - "--node-id=$(NODE_NAME)"
            - "--underlay=$(NODE_IP)"
            # The reflector listens on the control-plane node's fabric loopback,
            # reachable from every node over the BGP fabric (and cross-cluster later).
            - "--reflector={{ .Values.reflectorAddress }}"
            - "--dataplane=127.0.0.1:1337"
            # Reach the API over the fabric (the mgmt net has no inter-node path here).
            - "--kubeconfig=/etc/netplane/kubeconfig"
            {{- if .Values.routebus.mtls.enabled }}
            - "--tls-ca=/etc/routebus-tls/ca.crt"
            - "--tls-cert=/etc/routebus-tls/tls.crt"
            - "--tls-key=/etc/routebus-tls/tls.key"
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: kubeconfig
              mountPath: /etc/netplane
              readOnly: true
            {{- if .Values.routebus.mtls.enabled }}
            - name: routebus-tls
              mountPath: /etc/routebus-tls
              readOnly: true
            {{- end }}
      volumes:
        - name: kubeconfig
          configMap:
            name: netplane-agent-kubeconfig
        {{- if .Values.routebus.mtls.enabled }}
        - name: routebus-tls
          secret:
            secretName: agent-routebus-tls
        {{- end }}
