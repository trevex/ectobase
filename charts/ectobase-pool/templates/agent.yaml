apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mesh-agent
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: mesh-agent
    app.kubernetes.io/part-of: mesh
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mesh-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mesh-agent
        app.kubernetes.io/part-of: mesh
    spec:
      serviceAccountName: mesh-agent
      # Run on every node, including control-plane (the fabric's cp node is a host too).
      tolerations:
        - operator: Exists
      # hostNetwork so the agent can reach the reflector over the fabric loopback.
      # ClusterFirstWithHostNet keeps in-cluster DNS working, so the reflector
      # Service name (reflector.ectobase-system.svc) still resolves. The node-local
      # flowplane is reached over the shared /run/flowplane unix socket (mounted below).
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: agent
          image: {{ .Values.images.mesh }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          resources:
            {{- include "ectobase-pool.resources" . | nindent 12 }}
          command: ["agent"]
          # NOTE(tune): --underlay here is a fallback only. The reconciler announces
          # each endpoint's own status.underlayRoute (the /128 the attach path
          # allocated); --underlay is used only for interfaces not yet attached.
          args:
            - "--node-id=$(NODE_NAME)"
            - "--underlay=$(NODE_IP)"
            # The reflector listens on the control-plane node's fabric loopback,
            # reachable from every node over the BGP fabric (and cross-cluster later).
            - "--reflector={{ .Values.reflectorAddress }}"
            - "--dataplane=unix:///run/flowplane/dataplane.sock"
            # Reach the API over the fabric (the mgmt net has no inter-node path here).
            - "--kubeconfig=/etc/mesh/kubeconfig"
            {{- if .Values.routebus.mtls.enabled }}
            # ca = ROOT (verify the reflector, whose server cert chains to root) from the
            # broker-written intermediate Secret's ca.crt; cert/key = the pool-issued leaf
            # (cert-manager bundles leaf+intermediate into tls.crt for the CA issuer).
            - "--tls-ca=/etc/routebus-root/ca.crt"
            - "--tls-cert=/etc/routebus-tls/tls.crt"
            - "--tls-key=/etc/routebus-tls/tls.key"
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: kubeconfig
              mountPath: /etc/mesh
              readOnly: true
            # The dataplane's root-only gRPC socket, created by the flowplane DaemonSet on the
            # shared hostPath. Read-only: the agent is a client.
            - name: flowplane-sock
              mountPath: /run/flowplane
              readOnly: true
            {{- if .Values.routebus.mtls.enabled }}
            - name: routebus-tls
              mountPath: /etc/routebus-tls
              readOnly: true
            - name: routebus-root
              mountPath: /etc/routebus-root
              readOnly: true
            {{- end }}
      volumes:
        - name: kubeconfig
          configMap:
            name: mesh-agent-kubeconfig
        - name: flowplane-sock
          hostPath:
            path: /run/flowplane
            type: DirectoryOrCreate
        {{- if .Values.routebus.mtls.enabled }}
        - name: routebus-tls
          secret:
            secretName: agent-routebus-tls
        - name: routebus-root
          secret:
            secretName: {{ .Values.routebus.mtls.intermediateSecret }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
