# The agent runs on hostNetwork (to reach the node-local flowplane on 127.0.0.1:1337)
# and, on this fabric, the kind mgmt docker network has no working inter-node path —
# the ONLY inter-node transport is the IPv6 BGP fabric (via sw1). So the agent reaches
# the API server over the fabric at the control-plane node's loopback (the same address
# the reflector uses). The apiserver binds on all interfaces (incl. the fabric addr),
# but its serving cert has no SAN for the fabric loopback, so we skip TLS verification
# here (the SA bearer token still authenticates the client). insecure-skip-tls-verify
# is acceptable for this in-fabric control channel; a productionised build would add the
# fabric address to the apiserver cert SANs instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: netplane-agent-kubeconfig
  namespace: {{ .Values.namespace }}
data:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: fabric
        cluster:
          server: {{ .Values.apiserverAddress }}
          insecure-skip-tls-verify: true
    users:
      - name: sa
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
      - name: fabric
        context:
          cluster: fabric
          user: sa
    current-context: fabric
