apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatch-broker
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: dispatch-broker
    app.kubernetes.io/part-of: netplane
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dispatch-broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dispatch-broker
        app.kubernetes.io/part-of: netplane
    spec:
      serviceAccountName: dispatch-broker
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - operator: Exists
      containers:
        - name: broker
          image: {{ .Values.images.dispatchBroker }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          resources:
            {{- include "ectobase-pool.resources" . | nindent 12 }}
          command: ["broker"]
          args:
            - "--cluster-name={{ .Values.broker.clusterName }}"
            - "--dispatch-kubeconfig=/secrets/dispatch/kubeconfig"
          volumeMounts:
            - name: dispatch-kubeconfig
              mountPath: /secrets/dispatch
              readOnly: true
      volumes:
        - name: dispatch-kubeconfig
          secret:
            secretName: {{ .Values.broker.dispatchKubeconfigSecret }}
