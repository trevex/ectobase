apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatch-broker
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: dispatch-broker
    app.kubernetes.io/part-of: mesh
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dispatch-broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dispatch-broker
        app.kubernetes.io/part-of: mesh
    spec:
      serviceAccountName: dispatch-broker
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - operator: Exists
      containers:
        - name: broker
          image: {{ .Values.images.dispatchBroker | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          resources:
            {{- include "ectobase-pool.resources" . | nindent 12 }}
          command: ["broker"]
          args:
            - "--cluster-name={{ .Values.broker.clusterName }}"
            {{- if .Values.pki.enabled }}
            - "--dispatch-server={{ .Values.dispatchServer }}"
            # The dispatch serving cert is ROOT-signed; verify against the pre-provisioned root
            # (NOT the leaf/intermediate Secret's ca.crt). Mirrors the agent's routebus-root mount.
            - "--dispatch-ca=/secrets/dispatch-root/ca.crt"
            - "--dispatch-client-cert=/secrets/dispatch-cert/tls.crt"
            - "--dispatch-client-key=/secrets/dispatch-cert/tls.key"
            # First-boot only: short-lived token used to bootstrap the pool intermediate (submit
            # the RouteBusIdentity CSR) until cert-manager mints broker-dispatch-tls from it.
            - "--dispatch-bootstrap-kubeconfig=/secrets/dispatch-bootstrap/kubeconfig"
            {{- else }}
            - "--dispatch-kubeconfig=/secrets/dispatch/kubeconfig"
            {{- end }}
            {{- if .Values.pki.enabled }}
            # Bootstrap this pool's route-bus intermediate CA (generate keypair locally, CSR to
            # dispatch, write the signed intermediate into this Secret in POD_NAMESPACE).
            - "--routebus-intermediate-secret={{ .Values.pki.intermediateSecret }}"
            {{- with .Values.pki.underlayCIDRs }}
            # Pool underlay range(s) the intermediate is IP-name-constrained to.
            - "--routebus-underlay-cidrs={{ . }}"
            {{- end }}
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            {{- if .Values.pki.enabled }}
            - name: dispatch-cert
              mountPath: /secrets/dispatch-cert
              readOnly: true
            - name: dispatch-root
              mountPath: /secrets/dispatch-root
              readOnly: true
            - name: dispatch-bootstrap
              mountPath: /secrets/dispatch-bootstrap
              readOnly: true
            {{- else }}
            - name: dispatch-kubeconfig
              mountPath: /secrets/dispatch
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.pki.enabled }}
        # Optional: cert-manager mints broker-dispatch-tls only AFTER the broker bootstraps the
        # pool intermediate, so it is absent at first pod start (the broker waits for it).
        - name: dispatch-cert
          secret:
            secretName: broker-dispatch-tls
            optional: true
        # Pre-provisioned dispatch root CA (out-of-band at enrollment); the enrollment trust anchor.
        - name: dispatch-root
          secret:
            secretName: dispatch-root-ca
            items:
              - key: ca.crt
                path: ca.crt
        # Short-lived bootstrap-token kubeconfig (out-of-band at enrollment); first-boot only.
        - name: dispatch-bootstrap
          secret:
            secretName: broker-dispatch-bootstrap
        {{- else }}
        - name: dispatch-kubeconfig
          secret:
            secretName: {{ .Values.broker.dispatchKubeconfigSecret }}
        {{- end }}
