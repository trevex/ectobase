{{- /* Validate values on every render (this template always renders). The pool chart does
       not manage its release namespace ({{ .Values.namespace }}): that namespace hosts the
       privileged dataplane + hostNetwork pods and must be created PSA-privileged by the
       installer (`helm install --create-namespace` on a non-enforcing cluster, or a
       pre-created privileged namespace on a baseline-enforcing one like Talos). */}}
{{- include "ectobase-pool.validate" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mesh-agent
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mesh-agent
  labels: {{- include "ectobase-pool.labels" . | nindent 4 }}
rules:
  {{- (.Files.Get "files/mesh-agent/role.yaml" | fromYaml).rules | toYaml | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mesh-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mesh-agent
subjects:
  - kind: ServiceAccount
    name: mesh-agent
    namespace: {{ .Values.namespace }}
---
# The per-cluster broker (kubelet-analog) syncs compiled objects from the dispatch down into
# THIS downstream cluster's compiled.ectobase.dev CRDs (create/update/patch/delete + GC), reads
# Nodes for underlay/prefix reporting, and reads VMIs for VM lifecycle status. Dispatch-side
# credentials come from a separate mounted kubeconfig (broker.dispatchKubeconfigSecret); this
# RBAC is only the downstream (in-cluster) half. Dispatch-side RBAC is minted by the e2e token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dispatch-broker
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dispatch-broker
  labels: {{- include "ectobase-pool.labels" . | nindent 4 }}
rules:
  {{- (.Files.Get "files/dispatch-broker/role.yaml" | fromYaml).rules | toYaml | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dispatch-broker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dispatch-broker
subjects:
  - kind: ServiceAccount
    name: dispatch-broker
    namespace: {{ .Values.namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-materializer
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-materializer
  labels: {{- include "ectobase-pool.labels" . | nindent 4 }}
rules:
  {{- (.Files.Get "files/pod-materializer/role.yaml" | fromYaml).rules | toYaml | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-materializer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pod-materializer
subjects:
  - kind: ServiceAccount
    name: pod-materializer
    namespace: {{ .Values.namespace }}
{{- if .Values.vmMaterializer.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vm-materializer
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vm-materializer
  labels: {{- include "ectobase-pool.labels" . | nindent 4 }}
rules:
  {{- (.Files.Get "files/vm-materializer/role.yaml" | fromYaml).rules | toYaml | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vm-materializer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vm-materializer
subjects:
  - kind: ServiceAccount
    name: vm-materializer
    namespace: {{ .Values.namespace }}
{{- end }}
