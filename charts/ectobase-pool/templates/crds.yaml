{{- /*
The net and compiled CRDs, read from crd-bases/ (generated by `make generate`, so not edited by
hand). Each one gets helm.sh/resource-policy: keep, merged into whatever annotations controller-gen
wrote. Without it, `helm uninstall` or an upgrade to installCRDs=false deletes the CRDs, which
deletes every twin, and garbage collection then deletes the VMs, Pods and DataVolumes the
materializers created with a controller ownerReference to those twins.
*/}}
{{- if .Values.installCRDs }}
{{- range $path, $_ := .Files.Glob "crd-bases/*.yaml" }}
{{- $crd := $.Files.Get $path | fromYaml }}
{{- $annotations := $crd.metadata.annotations | default dict }}
{{- $_ := set $annotations "helm.sh/resource-policy" "keep" }}
{{- $_ := set $crd.metadata "annotations" $annotations }}
---
{{ toYaml $crd }}
{{- end }}
{{- end }}
