# KubeVirt network-binding NAD for the flowplane overlay. virt-controller injects
# this NAD into the virt-launcher pod's Multus annotation (per the `flowplane`
# binding registered in the KubeVirt CR, see the lab KubeVirt deploy (test/lab/internal/deploy/kubevirt.go)), so Multus runs
# our CNI IN THE LAUNCHER POD NETNS. The CNI (deviceType=pod-tap) creates the pod
# link `pod<hash>` (= the CNI_IFNAME Multus assigns) and the tap `tap<hash>`
# (= KubeVirt's GenerateTapDeviceName for a secondary network) in that netns,
# spliced to a root-netns veth carrying our datapath; KubeVirt's
# domainAttachmentType:tap discovers `pod<hash>` and opens `tap<hash>` as the VM's
# NIC, and our DHCP/ARP/RA responders configure the guest. The dataplane derives
# both names from the CNI_IFNAME, so no `tapName` is set here (a literal "tap0" is
# the PRIMARY-only name and would not be found on this secondary network).
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: flowplane
  namespace: {{ .Values.namespace }}
spec:
  config: |
    {
      "cniVersion": "1.0.0",
      "name": "flowplane",
      "plugins": [
        {
          "type": "flowplane-cni",
          "deviceType": "pod-tap"
        }
      ]
    }
