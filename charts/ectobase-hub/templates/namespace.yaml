#
# Creates BOTH namespaces used by the hub chart:
#   - {{ .Values.namespace }} (system) — hub apiserver, controller, kine, broker identity
#   - {{ .Values.agentNamespace }} (ectobase-system) — compiler (netplane-controller) + reflector
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    {{- include "ectobase-hub.labels" . | nindent 4 }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.agentNamespace }}
  labels:
    {{- include "ectobase-hub.labels" . | nindent 4 }}
