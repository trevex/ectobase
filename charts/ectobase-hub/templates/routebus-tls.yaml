{{- if .Values.routebus.mtls.enabled }}
# Copyright 2026 ectobase contributors
# SPDX-License-Identifier: Apache-2.0
#
# Route-bus mutual-TLS PKI (cert-manager). The hub chart owns the CA and a CA-type
# ClusterIssuer so BOTH charts issue from ONE trust anchor: the reflector's server
# cert (here) and the hub-controller + agent client certs. Install the hub chart
# BEFORE the pool chart so the ClusterIssuer exists when the agent Certificate
# reconciles (cert-manager retries until it does).
#
# NOTE: a CA-type ClusterIssuer reads its CA secret from cert-manager's
# cluster-resource-namespace (default "cert-manager"). Install cert-manager with
# --cluster-resource-namespace={{ .Values.agentNamespace }}, or mirror the
# {{ .Values.routebus.mtls.caSecretName }} secret into cert-manager's namespace.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: routebus-selfsign
  namespace: {{ .Values.agentNamespace }}
  labels:
    {{- include "ectobase-hub.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: routebus-ca
  namespace: {{ .Values.agentNamespace }}
  labels:
    {{- include "ectobase-hub.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: ectobase-routebus-ca
  secretName: {{ .Values.routebus.mtls.caSecretName }}
  duration: 87600h # 10y
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: routebus-selfsign
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.routebus.mtls.clusterIssuer }}
  labels:
    {{- include "ectobase-hub.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ .Values.routebus.mtls.caSecretName }}
---
# Reflector server identity. Agents dial the reflector by its fabric-loopback IP,
# so the IP MUST be a SAN or client verification fails.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: reflector-routebus-tls
  namespace: {{ .Values.agentNamespace }}
  labels:
    {{- include "ectobase-hub.labels" . | nindent 4 }}
spec:
  secretName: reflector-routebus-tls
  duration: 8760h # 1y
  privateKey:
    algorithm: ECDSA
    size: 256
  ipAddresses:
    - {{ .Values.routebus.mtls.reflectorIP | quote }}
  dnsNames:
    - reflector
    - reflector.{{ .Values.agentNamespace }}
    - reflector.{{ .Values.agentNamespace }}.svc
  usages:
    - server auth
    - client auth
  issuerRef:
    name: {{ .Values.routebus.mtls.clusterIssuer }}
    kind: ClusterIssuer
---
# hub-controller client identity. commonName MUST match the reflector's
# --admin-client-cn so the admin (fence) API accepts it.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hub-controller-routebus-tls
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ectobase-hub.labels" . | nindent 4 }}
spec:
  secretName: hub-controller-routebus-tls
  duration: 8760h # 1y
  commonName: hub-controller
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - client auth
  issuerRef:
    name: {{ .Values.routebus.mtls.clusterIssuer }}
    kind: ClusterIssuer
{{- end }}
