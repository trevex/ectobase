#
# Registers the aggregated groups with the host kube-apiserver, pointing at the in-cluster
# apiserver-service. The hub apiserver serves FIVE groups: platform.ectobase.dev (ClusterPool),
# net.ectobase.dev (VPC/NetworkInterface/FirewallPolicy/FloatingIP/LoadBalancer/NATGateway/
# VPCPeering), compute.ectobase.dev (VirtualMachine/Container), storage.ectobase.dev (Volume),
# and compiled.ectobase.dev (CompiledNIC/CompiledVM/CompiledContainer/CompiledVolumeAttachment).
# insecureSkipTLSVerify because the serving cert is self-signed/ephemeral (see apiserver.yaml).
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.platform.ectobase.dev
  labels:
    {{- include "ectobase-hub.labels" . | nindent 4 }}
spec:
  group: platform.ectobase.dev
  version: v1alpha1
  service:
    namespace: {{ .Values.namespace }}
    name: apiserver-service
    port: 443
  insecureSkipTLSVerify: true
  groupPriorityMinimum: 2000
  versionPriority: 100
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.net.ectobase.dev
  labels:
    {{- include "ectobase-hub.labels" . | nindent 4 }}
spec:
