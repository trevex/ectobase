#
# The reflector: routebus gRPC rendezvous server for the per-pool netplane
# agents. Runs on hostNetwork pinned to the control-plane node so agents
# can reach it over the fabric loopback (fd00:db8:0:1::1) without ClusterIP DNAT.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reflector
  namespace: {{ .Values.agentNamespace }}
  labels:
    app.kubernetes.io/name: reflector
    app.kubernetes.io/part-of: netplane
    {{- include "ectobase-hub.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: reflector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reflector
        app.kubernetes.io/part-of: netplane
    spec:
      serviceAccountName: netplane-reflector
      # The reflector is the global rendezvous. It runs on hostNetwork and is pinned
      # to the control-plane node, listening on that node's FABRIC loopback
      # (fd00:db8:0:1::1) — reachable from every node (and, in multi-cluster, every
      # compute cluster) over the same IPv6 BGP fabric the dataplane encaps over.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - operator: Exists
      containers:
        - name: reflector
          image: {{ .Values.images.netplane }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["reflector"]
          args: ["--listen=:1338"]
          ports:
            - name: routebus
              containerPort: 1338
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: reflector
  namespace: {{ .Values.agentNamespace }}
  labels:
    app.kubernetes.io/name: reflector
    app.kubernetes.io/part-of: netplane
    {{- include "ectobase-hub.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: reflector
  ports:
    - name: routebus
      port: 1338
      targetPort: 1338
      protocol: TCP
