#
# The hub controller: a controller-runtime manager running the ClusterPool
# reconciler against the aggregated apiserver. RBAC rules are sourced from
# the generated files/hub-controller/role.yaml.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hub-controller
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ectobase-hub.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hub-controller
  labels:
    {{- include "ectobase-hub.labels" . | nindent 4 }}
rules:
  {{- (.Files.Get "files/hub-controller/role.yaml" | fromYaml).rules | toYaml | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hub-controller
  labels:
    {{- include "ectobase-hub.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hub-controller
subjects:
  - kind: ServiceAccount
    name: hub-controller
    namespace: {{ .Values.namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub-controller
  namespace: {{ .Values.namespace }}
  labels:
    app: hub-controller
    {{- include "ectobase-hub.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hub-controller
  template:
    metadata:
      labels:
        app: hub-controller
    spec:
      serviceAccountName: hub-controller
      containers:
        - name: controller
          image: {{ .Values.images.hubController }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            - "-reflector-admin={{ .Values.reflectorAdmin }}"
            - "-csi-driver=rbd.csi.ceph.com"
            # The ceph fsid (clusterID) is per-deploy (the lab ceph deploy emits it), so it cannot be
            # baked in; the tier2 live deploy patches this arg with the real fsid. Empty here =>
            # NetworkFence spec.parameters.clusterID omitted => the ceph-csi driver rejects the fence
            # ("missing or empty clusterID"). MUST be set to the fsid for the storage fence to succeed.
            - "-csi-cluster-id="
            - "-csi-secret-name=csi-rbd-secret"
            - "-csi-secret-namespace=ceph-csi"
          env:
            # client-go's WatchListClient uses SendInitialEvents=true streaming
            # list-watches that this aggregated apiserver (older apiserver libs)
            # does not support, leaving the informer stuck with no initial LIST
            # (workers start but no events ever arrive). Disable it so the cache
            # falls back to a plain LIST+WATCH.
            - name: KUBE_FEATURE_WatchListClient
              value: "false"
