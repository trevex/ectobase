#
# Hub-side hub-broker identity: the ServiceAccount + ClusterRole + Binding that
# the per-pool broker uses when authenticating to the hub apiserver. Lives in
# the hub's `system` namespace ({{ .Values.namespace }}). RBAC rules are sourced
# from the generated files/hub-broker/role.yaml.
#
# NOTE: the downstream (in-pool) broker SA and its RBAC live in the ectobase
# (pool) chart, NOT here.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hub-broker
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ectobase-hub.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hub-broker
  labels:
    {{- include "ectobase-hub.labels" . | nindent 4 }}
rules:
  {{- (.Files.Get "files/hub-broker/role.yaml" | fromYaml).rules | toYaml | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hub-broker
  labels:
    {{- include "ectobase-hub.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hub-broker
subjects:
  - kind: ServiceAccount
    name: hub-broker
    namespace: {{ .Values.namespace }}
