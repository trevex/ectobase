#
# The dispatch aggregated apiserver (platform.ectobase.dev et al.). Stores objects in
# kine (--etcd-servers=http://kine:2379) and self-generates a self-signed
# serving cert on startup (apiserver-kit MaybeDefaultWithSelfSignedCerts into
# --cert-dir, an emptyDir). Delegated authn/authz uses the pod's ServiceAccount
# (in-cluster config).
#
# NOTE (dev/smoke only): the APIService (apiservice.yaml) uses
# insecureSkipTLSVerify because the serving cert is self-signed and ephemeral.
# Production must inject a caBundle instead.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dispatch-apiserver
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
---
# Allow the aggregated apiserver to delegate authn/authz to the host kube-apiserver.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dispatch-apiserver-auth-delegator
  labels:
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: dispatch-apiserver
    namespace: {{ .Values.namespace }}
---
# Scoped read for the generic apiserver's built-in informers. k8s.io/apiserver runs webhook
# admission (validating/mutating configs) and API Priority & Fairness (flowschemas +
# prioritylevelconfigurations) controllers whose informers must sync before /readyz passes, plus
# namespace-lifecycle admission (namespaces). Without these the SA is RBAC-forbidden and the
# aggregated API never becomes Ready. This is the least-privilege replacement for the former
# cluster-admin binding (get;list;watch only, no writes, no access to arbitrary resources).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dispatch-apiserver-informers
  labels:
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["flowcontrol.apiserver.k8s.io"]
    resources: ["flowschemas", "prioritylevelconfigurations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dispatch-apiserver-informers
  labels:
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dispatch-apiserver-informers
subjects:
  - kind: ServiceAccount
    name: dispatch-apiserver
    namespace: {{ .Values.namespace }}
---
{{- if .Values.dispatchApiserver.grantClusterAdmin }}
# Escape hatch (default OFF): a broad cluster-admin binding, in case a future apiserver-kit admission
# chain needs host reads beyond the scoped informer role above (a specific RBAC-forbidden error names
# the missing resource — prefer adding it to dispatch-apiserver-informers over enabling this).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dispatch-apiserver-admin
  labels:
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: dispatch-apiserver
    namespace: {{ .Values.namespace }}
---
{{- end }}
# Access to the extension-apiserver-authentication configmap in kube-system,
# which carries the requestheader/client CA the aggregation layer needs.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dispatch-apiserver-extension-auth-reader
  namespace: kube-system
  labels:
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: dispatch-apiserver
    namespace: {{ .Values.namespace }}
---
apiVersion: v1
kind: Service
metadata:
  name: apiserver-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
spec:
  selector:
    app: dispatch-apiserver
  ports:
    - name: https
      port: 443
      targetPort: {{ ternary 6444 6443 .Values.pki.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatch-apiserver
  namespace: {{ .Values.namespace }}
  labels:
    app: dispatch-apiserver
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
spec:
  replicas: 1
  {{- if .Values.pki.enabled }}
  # hostNetwork singleton: a rolling update would surge a 2nd pod that collides on the host
  # port (6444), deadlocking the rollout. Recreate tears the old pod down first.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app: dispatch-apiserver
  template:
    metadata:
      labels:
        app: dispatch-apiserver
    spec:
      {{- if .Values.pki.enabled }}
      # Direct fabric exposure: the cross-cluster broker connects straight to the ectobase
      # apiserver (verifying its ectobase-ca serving cert + presenting its client cert), rather
      # than via the host kube-apiserver's aggregation (which serves the HOST cluster CA). 6443
      # is the host kube-apiserver, so bind 6444. Aggregation for in-cluster clients is
      # unaffected (the ClusterIP Service targetPort follows to 6444).
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      serviceAccountName: dispatch-apiserver
      containers:
        - name: apiserver
          image: {{ .Values.images.dispatchApiserver | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          resources:
            {{- include "ectobase-dispatch.resources" . | nindent 12 }}
          args:
            - "--etcd-servers=http://kine:2379"
            - "--secure-port={{ ternary 6444 6443 .Values.pki.enabled }}"
            - "--cert-dir=/var/run/apiserver/certs"
            - "--audit-log-path=-"
            # The admission-policy plugins' informers watch alpha resources
            # (Mutating/ValidatingAdmissionPolicyBinding) that this host kube does
            # not serve, so informer-sync never completes and /readyz stays 500.
            # We serve no admission policies here, so disable those plugins.
            - "--disable-admission-plugins=MutatingAdmissionPolicy,ValidatingAdmissionPolicy"
            {{- if .Values.pki.enabled }}
            # Serve the cert-manager cert (bypasses the self-signed --cert-dir path) and trust
            # the ectobase root as a client CA. Unioned with the existing delegated token authn,
            # so bearer-token brokers keep working during migration.
            - "--tls-cert-file=/secrets/serving/tls.crt"
            - "--tls-private-key-file=/secrets/serving/tls.key"
            - "--client-ca-file=/secrets/client-ca/tls.crt"
            {{- end }}
          ports:
            - name: https
              containerPort: {{ ternary 6444 6443 .Values.pki.enabled }}
          volumeMounts:
            - name: cert-dir
              mountPath: /var/run/apiserver/certs
            {{- if .Values.pki.enabled }}
            - name: serving-cert
              mountPath: /secrets/serving
              readOnly: true
            - name: client-ca
              mountPath: /secrets/client-ca
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ ternary 6444 6443 .Values.pki.enabled }}
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: {{ ternary 6444 6443 .Values.pki.enabled }}
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: cert-dir
          emptyDir: {}
        {{- if .Values.pki.enabled }}
        - name: serving-cert
          secret:
            secretName: dispatch-apiserver-tls
        - name: client-ca
          secret:
            secretName: {{ .Values.pki.caSecretName }}
        {{- end }}
