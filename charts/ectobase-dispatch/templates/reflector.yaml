#
# The reflector: routebus gRPC rendezvous server for the per-pool netplane
# agents. Runs on hostNetwork pinned to the control-plane node so agents
# can reach it over the fabric loopback (fd00:db8:0:1::1) without ClusterIP DNAT.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reflector
  namespace: {{ .Values.agentNamespace }}
  labels:
    app.kubernetes.io/name: reflector
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: reflector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reflector
    spec:
      serviceAccountName: netplane-reflector
      # The reflector is the global rendezvous. It runs on hostNetwork and is pinned
      # to the control-plane node, listening on that node's FABRIC loopback
      # (fd00:db8:0:1::1) — reachable from every node (and, in multi-cluster, every
      # compute cluster) over the same IPv6 BGP fabric the dataplane encaps over.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - operator: Exists
      containers:
        - name: reflector
          image: {{ .Values.images.netplane }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          resources:
            {{- include "ectobase-dispatch.resources" . | nindent 12 }}
          command: ["reflector"]
          args:
            - "--listen=:1338"
            # The RouteBusAdmin (fence) API is served on a SEPARATE socket from the
            # agent-facing session port, so an agent holding a valid session cert
            # cannot drive fencing. Only the dispatch-controller reaches :1339.
            - "--admin-listen=:1339"
            {{- if .Values.routebus.mtls.enabled }}
            - "--admin-client-cn=dispatch-controller"
            - "--tls-ca=/etc/routebus-tls/ca.crt"
            - "--tls-cert=/etc/routebus-tls/tls.crt"
            - "--tls-key=/etc/routebus-tls/tls.key"
            {{- end }}
          ports:
            - name: routebus
              containerPort: 1338
              protocol: TCP
            - name: routebus-admin
              containerPort: 1339
              protocol: TCP
          {{- if .Values.routebus.mtls.enabled }}
          volumeMounts:
            - name: routebus-tls
              mountPath: /etc/routebus-tls
              readOnly: true
          {{- end }}
      {{- if .Values.routebus.mtls.enabled }}
      volumes:
        - name: routebus-tls
          secret:
            secretName: reflector-routebus-tls
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: reflector
  namespace: {{ .Values.agentNamespace }}
  labels:
    app.kubernetes.io/name: reflector
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: reflector
  ports:
    - name: routebus
      port: 1338
      targetPort: 1338
      protocol: TCP
    - name: routebus-admin
      port: 1339
      targetPort: 1339
      protocol: TCP
