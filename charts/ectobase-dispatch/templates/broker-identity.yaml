#
# There is deliberately NO fleet-wide broker role here.
#
# A pool broker used to hold one shared ClusterRole, bound to the "ectobase:brokers" cert group,
# granting compiled.* and platform.* across the whole fleet. That made cross-pool READS possible:
# every pool's credential could list every other pool's compiled state, and only the broker's own
# client-side filter kept it from doing so. A filter the caller chooses is not an authorization
# boundary.
#
# Each pool's access is now provisioned at enrollment, alongside its ClusterPool, and is scoped two
# ways (see clusterPoolsManifest in test/lab/internal/deploy/ectobase.go):
#
#   * by NAMESPACE — a Role/RoleBinding in pool-<name> for that pool's compiled objects, which is
#     expressible only because the broker's cache and lists are namespace-scoped: a cluster-wide
#     LIST authorizes against an empty namespace that no RoleBinding can match;
#   * by NAME — a ClusterRole/Binding with resourceNames for the cluster-scoped objects it owns
#     (its ClusterPool, its RouteBusIdentity), which is why the broker reads those UNCACHED.
#
# Writes stay narrow within that: status subresources only, so a broker can never edit a spec,
# create, or delete. That is what made the ClusterRestriction admission plugin redundant.
#
# NOTE: the downstream (in-pool) broker SA and its RBAC live in the ectobase (pool) chart, NOT here.

# NOTE: the first-boot bootstrap identity is NOT fleet-wide. A RouteBusIdentity carries a pool's
# intermediate-CA CSR + signed cert, so one shared bootstrap ServiceAccount (or a fleet-wide grant
# on the role above) would let any pool's credential obtain any OTHER pool's intermediate CA. Each
# pool instead gets, provisioned at enrollment alongside its ClusterPool:
#   * a pre-created RouteBusIdentity named <pool> (resourceNames cannot scope `create`, so the
#     broker only ever get/updates it),
#   * a ServiceAccount dispatch-broker-bootstrap-<pool> (the short-lived first-boot token), and
#   * a ClusterRole/Binding dispatch-broker-pool-<pool> scoped with resourceNames: [<pool>],
#     bound to BOTH that SA and the pool's steady-state cert identity ectobase:cluster:<pool>.
# See docs/operations/deploy-helm.md#fresh-pool-enrollment-bootstrap.
