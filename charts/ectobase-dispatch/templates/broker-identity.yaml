#
# Dispatch-side dispatch-broker identity: the ServiceAccount + ClusterRole + Binding that
# the per-pool broker uses when authenticating to the dispatch apiserver. Lives in
# the dispatch's `system` namespace ({{ .Values.namespace }}). RBAC rules are sourced
# from the generated files/dispatch-broker/role.yaml.
#
# NOTE: the downstream (in-pool) broker SA and its RBAC live in the ectobase
# (pool) chart, NOT here.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dispatch-broker
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dispatch-broker
  labels:
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
rules:
  {{- (.Files.Get "files/dispatch-broker/role.yaml" | fromYaml).rules | toYaml | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dispatch-broker
  labels:
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dispatch-broker
subjects:
  - kind: ServiceAccount
    name: dispatch-broker
    namespace: {{ .Values.namespace }}
  # Cert-authenticated brokers present Org=ectobase:brokers; per-pool write-scope is enforced
  # by the ClusterRestriction admission plugin off the CN (ectobase:cluster:<pool>).
  - kind: Group
    name: "ectobase:brokers"
    apiGroup: rbac.authorization.k8s.io
---
# Bootstrap identity: a fresh pool's broker uses a short-lived token for this SA to submit its
# RouteBusIdentity CSR and read back the signed intermediate — the ONLY thing it can do — before
# cert-manager mints the pool's steady-state broker client cert. Intermediate RENEWALS thereafter
# use the steady-state leaf (Org=ectobase:brokers, granted routebusidentities by the role above),
# so this identity is needed only at first boot.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dispatch-broker-bootstrap
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dispatch-broker-bootstrap
  labels:
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
rules:
  - apiGroups: ["platform.ectobase.dev"]
    resources: ["routebusidentities"]
    verbs: ["create", "get", "update"]
  - apiGroups: ["platform.ectobase.dev"]
    resources: ["routebusidentities/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dispatch-broker-bootstrap
  labels:
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dispatch-broker-bootstrap
subjects:
  - kind: ServiceAccount
    name: dispatch-broker-bootstrap
    namespace: {{ .Values.namespace }}
