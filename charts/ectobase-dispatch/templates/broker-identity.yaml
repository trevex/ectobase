#
# Dispatch-side dispatch-broker identity: the ClusterRole + Binding that grants the
# "ectobase:brokers" cert group (the mTLS route-bus identity every pool broker presents)
# access to the dispatch apiserver. Lives in the dispatch's `system` namespace
# ({{ .Values.namespace }}). RBAC rules are sourced from the generated
# files/dispatch-broker/role.yaml.
#
# NOTE: the downstream (in-pool) broker SA and its RBAC live in the ectobase
# (pool) chart, NOT here.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dispatch-broker
  labels:
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
rules:
  {{- (.Files.Get "files/dispatch-broker/role.yaml" | fromYaml).rules | toYaml | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dispatch-broker
  labels:
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dispatch-broker
subjects:
  # Cert-authenticated brokers present Org=ectobase:brokers; per-pool write-scope is enforced
  # by the ClusterRestriction admission plugin off the CN (ectobase:cluster:<pool>).
  - kind: Group
    name: "ectobase:brokers"
    apiGroup: rbac.authorization.k8s.io

# NOTE: the first-boot bootstrap identity is NOT fleet-wide. A RouteBusIdentity carries a pool's
# intermediate-CA CSR + signed cert, so one shared bootstrap ServiceAccount (or a fleet-wide grant
# on the role above) would let any pool's credential obtain any OTHER pool's intermediate CA. Each
# pool instead gets, provisioned at enrollment alongside its ClusterPool:
#   * a pre-created RouteBusIdentity named <pool> (resourceNames cannot scope `create`, so the
#     broker only ever get/updates it),
#   * a ServiceAccount dispatch-broker-bootstrap-<pool> (the short-lived first-boot token), and
#   * a ClusterRole/Binding dispatch-broker-pool-<pool> scoped with resourceNames: [<pool>],
#     bound to BOTH that SA and the pool's steady-state cert identity ectobase:cluster:<pool>.
# See docs/operations/deploy-helm.md#fresh-pool-enrollment-bootstrap.
