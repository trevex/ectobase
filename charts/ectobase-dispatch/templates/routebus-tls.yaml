{{- if .Values.pki.enabled }}
# Copyright 2026 ectobase contributors
# SPDX-License-Identifier: Apache-2.0
#
# Route-bus mutual-TLS PKI (cert-manager). The dispatch chart owns the CA and a CA-type
# ClusterIssuer so BOTH charts issue from ONE trust anchor: the reflector's server
# cert (here) and the dispatch-controller + agent client certs. Install the dispatch chart
# BEFORE the pool chart so the ClusterIssuer exists when the agent Certificate
# reconciles (cert-manager retries until it does).
#
# NOTE: a CA-type ClusterIssuer reads its CA secret from cert-manager's
# cluster-resource-namespace (default "cert-manager"). Install cert-manager with
# --cluster-resource-namespace={{ .Values.agentNamespace }}, or mirror the
# {{ .Values.pki.caSecretName }} secret into cert-manager's namespace.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: ectobase-ca-selfsign
  # The root CA + selfsign issuer live in the dispatch-controller's namespace so the signer
  # can mount the root cert+key to sign pool intermediates. The cluster-scoped ClusterIssuer
  # (below) still needs this CA secret in cert-manager's cluster-resource-namespace.
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ectobase-ca
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: ectobase-ca
  secretName: {{ .Values.pki.caSecretName }}
  duration: 87600h # 10y
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: ectobase-ca-selfsign
    kind: Issuer
---
# The dispatch client CA: a SEPARATE self-signed root, the only CA the dispatch apiserver accepts
# client certificates from. The dispatch-controller's signer issues each pool broker's client
# certificate from it (forced subject CN=ectobase:cluster:<pool>, O=ectobase:brokers). It is not the
# ectobase-ca root above because every pool intermediate chains to that one. There is deliberately
# no Issuer for it: nothing but the signer issues from it, and an Issuer would let anyone allowed to
# create a cert-manager Certificate here mint an apiserver client identity.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ectobase-dispatch-client-ca
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: ectobase-dispatch-client-ca
  secretName: {{ .Values.pki.clientCASecretName }}
  duration: 87600h # 10y
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: ectobase-ca-selfsign
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.pki.clusterIssuer }}
  labels:
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ .Values.pki.caSecretName }}
---
# Reflector server identity. Agents dial the reflector by its fabric-loopback IP,
# so the IP MUST be a SAN or client verification fails.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: reflector-routebus-tls
  namespace: {{ .Values.agentNamespace }}
  labels:
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
spec:
  secretName: reflector-routebus-tls
  duration: 8760h # 1y
  privateKey:
    algorithm: ECDSA
    size: 256
  ipAddresses:
    - {{ .Values.pki.reflectorIP | quote }}
  dnsNames:
    - reflector
    - reflector.{{ .Values.agentNamespace }}
    - reflector.{{ .Values.agentNamespace }}.svc
  usages:
    - server auth
    - client auth
  issuerRef:
    name: {{ .Values.pki.clusterIssuer }}
    kind: ClusterIssuer
---
# dispatch-controller client identity. commonName MUST match the reflector's
# --admin-client-cn so the admin (fence) API accepts it.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dispatch-controller-routebus-tls
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
spec:
  secretName: dispatch-controller-routebus-tls
  duration: 8760h # 1y
  commonName: dispatch-controller
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - client auth
  issuerRef:
    name: {{ .Values.pki.clusterIssuer }}
    kind: ClusterIssuer
---
# Dispatch aggregated-apiserver serving cert. The broker dials by fabric IP literal, so that
# IP MUST be an IP SAN or the broker's TLS verification fails. Issued from the ectobase root.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dispatch-apiserver-tls
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
spec:
  secretName: dispatch-apiserver-tls
  duration: 8760h # 1y
  privateKey:
    algorithm: ECDSA
    size: 256
  ipAddresses:
    - {{ .Values.dispatchApiserver.serviceIP | quote }}
  dnsNames:
    - apiserver-service
    - apiserver-service.{{ .Values.namespace }}
    - apiserver-service.{{ .Values.namespace }}.svc
  usages:
    - server auth
  issuerRef:
    name: {{ .Values.pki.clusterIssuer }}
    kind: ClusterIssuer
{{- end }}
