#
# Postgres + kine (etcd-v3 shim) for the dispatch aggregated apiserver's storage.
# Mirrors dispatch/hack/kine-up.sh (rancher/kine over Postgres). kine exposes an
# etcd-v3 gRPC endpoint on :2379 that the apiserver talks to via --etcd-servers.
# Postgres holds ALL dispatch cluster state, so its data directory is persistent by default
# (postgres.persistence: a PVC, or a hostPath). Single replica, not HA.
{{- $persistence := .Values.postgres.persistence }}
{{- if not (has $persistence.type (list "pvc" "hostPath" "emptyDir")) }}
{{- fail (printf "invalid values: postgres.persistence.type=%q, must be one of pvc, hostPath, emptyDir" $persistence.type) }}
{{- end }}
---
# The postgres/kine password lives in a Secret rather than inline in the pod spec. Still dev-grade
# (default value), but it keeps the credential out of the rendered Deployment and lets an operator
# override it via values without editing templates.
apiVersion: v1
kind: Secret
metadata:
  name: kine-db
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.kine.password | quote }}
{{- if eq $persistence.type "pvc" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with $persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $persistence.size | quote }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
spec:
  selector:
    app: dispatch-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
  labels:
    app: dispatch-postgres
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
spec:
  replicas: 1
  # One data directory, one pod: a rolling update would start the new postgres against a RWO
  # volume (or hostPath) the old one still holds. Recreate stops the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dispatch-postgres
  template:
    metadata:
      labels:
        app: dispatch-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.images.postgres | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          resources:
            {{- include "ectobase-dispatch.resources" . | nindent 12 }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kine-db
                  key: password
            - name: POSTGRES_DB
              value: kine
            # A subdirectory of the mount, so a fresh filesystem's lost+found does not stop initdb.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          {{- if eq $persistence.type "pvc" }}
          persistentVolumeClaim:
            claimName: postgres-data
          {{- else if eq $persistence.type "hostPath" }}
          hostPath:
            path: {{ $persistence.path | quote }}
            type: DirectoryOrCreate
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: kine
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
spec:
  selector:
    app: dispatch-kine
  ports:
    - name: etcd
      port: 2379
      targetPort: 2379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kine
  namespace: {{ .Values.namespace }}
  labels:
    app: dispatch-kine
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dispatch-kine
  template:
    metadata:
      labels:
        app: dispatch-kine
    spec:
      containers:
        - name: kine
          image: {{ .Values.images.kine | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          resources:
            {{- include "ectobase-dispatch.resources" . | nindent 12 }}
          # Build the DSN at runtime so the password comes from the Secret (env) instead of being
          # baked into the rendered args.
          command: ["/bin/sh", "-c"]
          args:
            - exec kine --endpoint="postgres://postgres:${KINE_DB_PASSWORD}@postgres:5432/kine?sslmode=disable" --listen-address=0.0.0.0:2379
          env:
            - name: KINE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kine-db
                  key: password
          ports:
            - containerPort: 2379
          readinessProbe:
            tcpSocket:
              port: 2379
            initialDelaySeconds: 5
            periodSeconds: 5
