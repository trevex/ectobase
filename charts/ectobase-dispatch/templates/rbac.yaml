#
# RBAC for the mesh compiler (mesh-controller) in agentNamespace
# (ectobase-system). Rules are sourced from the generated
# files/mesh-controller/role.yaml.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mesh-controller
  namespace: {{ .Values.agentNamespace }}
  labels:
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mesh-controller
  labels:
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
rules:
  {{- (.Files.Get "files/mesh-controller/role.yaml" | fromYaml).rules | toYaml | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mesh-controller
  labels:
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mesh-controller
subjects:
  - kind: ServiceAccount
    name: mesh-controller
    namespace: {{ .Values.agentNamespace }}
---
# The reflector holds no Kubernetes credentials (it speaks the routebus gRPC
# protocol to agents only), so it gets a bare ServiceAccount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mesh-reflector
  namespace: {{ .Values.agentNamespace }}
  labels:
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
