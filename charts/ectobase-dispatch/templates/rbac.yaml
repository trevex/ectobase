#
# RBAC for the netplane compiler (netplane-controller) in agentNamespace
# (ectobase-system). Rules are sourced from the generated
# files/netplane-controller/role.yaml.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: netplane-controller
  namespace: {{ .Values.agentNamespace }}
  labels:
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: netplane-controller
  labels:
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
rules:
  {{- (.Files.Get "files/netplane-controller/role.yaml" | fromYaml).rules | toYaml | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: netplane-controller
  labels:
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: netplane-controller
subjects:
  - kind: ServiceAccount
    name: netplane-controller
    namespace: {{ .Values.agentNamespace }}
---
# The reflector holds no Kubernetes credentials (it speaks the routebus gRPC
# protocol to agents only), so it gets a bare ServiceAccount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: netplane-reflector
  namespace: {{ .Values.agentNamespace }}
  labels:
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
