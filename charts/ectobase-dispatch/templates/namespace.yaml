#
# The chart's RELEASE namespace ({{ .Values.namespace }}, default "system") holds the dispatch
# apiserver, controller, kine, and broker identity — all baseline-PSA-safe pods — and is
# created by the installer (`helm install --create-namespace` or a pre-created namespace),
# NOT managed here (a chart cannot bootstrap its own release namespace).
#
# This template manages only the EXTRA namespace {{ .Values.agentNamespace }}
# (default "ectobase-system"), which hosts the compiler (mesh-controller) + reflector.
# Those run hostNetwork, so the namespace is marked PSA-privileged to be admitted under a
# baseline-enforcing cluster (e.g. Talos); harmless on non-enforcing clusters (kind).
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.agentNamespace }}
  labels:
    pod-security.kubernetes.io/enforce: privileged
    {{- include "ectobase-dispatch.labels" . | nindent 4 }}
