# namespace is the Kubernetes namespace for dispatch infrastructure:
#   dispatch-apiserver, dispatch-controller, kine, postgres, and the dispatch-side dispatch-broker identity.
# These pods are baseline-PSA-safe; the installer owns this (release) namespace.
namespace: system

# agentNamespace is the Kubernetes namespace for the mesh compiler and reflector.
# They run hostNetwork, so the chart creates this namespace PSA-privileged.
agentNamespace: ectobase-system

# reflectorAdmin is the reflector RouteBusAdmin (fence) address the dispatch-controller
# dials. It is the SEPARATE admin port (1339), not the agent-facing session port
# (1338), so a session-cert holder cannot reach the fence API.
reflectorAdmin: "[fd00:db8:0:1::1]:1339"

# pki configures the route-bus transport between the reflector, the agents, and
# the dispatch-controller's fence client.
pki:
  # enabled turns on mutual TLS for the route bus AND CN-gates the fence API to the
  # dispatch-controller identity. REQUIRES cert-manager in the cluster (the dispatch chart
  # provisions a self-signed CA + ClusterIssuer that this and the pool chart issue
  # from). Mandatory: mTLS is the sole broker→dispatch auth path (cert-manager is
  # a required dependency).
  enabled: true
  # clusterIssuer is the shared CA ClusterIssuer name; MUST match the pool chart.
  clusterIssuer: ectobase-ca
  # caSecretName holds the CA keypair backing the ClusterIssuer.
  caSecretName: ectobase-ca
  # clientCASecretName holds the dispatch client CA: a separate self-signed root, the only CA the
  # dispatch apiserver accepts client certificates from. The dispatch-controller signs each pool
  # broker's client certificate from it; the apiserver mounts only its certificate.
  clientCASecretName: ectobase-dispatch-client-ca
  # reflectorIP is the fabric-loopback IP agents dial; added as a SAN on the
  # reflector server cert. MUST match the host part of reflectorAddress/reflectorAdmin.
  reflectorIP: "fd00:db8:0:1::1"
  # fleetIdentities names the RouteBusIdentities that are NOT pools, such as the WAN edge fleet's
  # `edge`, passed to the signer as --routebus-fleet-identities. The signer constrains a fleet
  # identity's intermediate to its own spec.permittedUnderlayCIDRs, so list only identities the
  # operator creates and no broker can write. Every other identity must be a ClusterPool with
  # spec.underlayPrefix. Empty by default: an install trusts no identity's own spec until told to.
  # A name here must not also be a ClusterPool; the signer denies the collision.
  fleetIdentities: []

# imagePullPolicy applies to all containers in the chart.
# External Ceph the dispatch controller fences against. clusterID is the cluster's fsid,
# which only the deploy knows, so `lab tier2 up` sets it with `helm upgrade --reset-then-reuse-values`.
ceph:
  clusterID: ""

imagePullPolicy: IfNotPresent

# dispatchApiserver tunes the aggregated apiserver.
dispatchApiserver:
  # grantClusterAdmin binds the apiserver SA to cluster-admin. Default off: auth-delegator +
  # the extension-apiserver-authentication reader are the standard host-cluster access an
  # aggregated apiserver needs. Turn on only if the admission chain needs broader host reads.
  grantClusterAdmin: false
  # serviceIP is the IPv6 fabric address the broker dials the aggregated apiserver at
  # (kubeconfig server host). It MUST be an IP SAN on the serving cert, or the broker's
  # TLS verification fails once insecure-skip-tls-verify is dropped.
  serviceIP: "fd00:db8:0:1::1"

# kine is the etcd-v3-over-Postgres storage for the aggregated apiserver.
kine:
  # password backs both Postgres and the kine DSN, delivered via the kine-db Secret. Dev-grade
  # default; override for anything beyond a throwaway smoke cluster. Postgres takes it only when it
  # initializes an empty data directory, so changing it later on persistent storage locks kine out.
  password: kine

# postgres is kine's backing database: its data directory holds ALL dispatch cluster state.
postgres:
  persistence:
    # type is where that data directory lives:
    #   pvc      - a ReadWriteOnce PersistentVolumeClaim (storageClass, size). The claim outlives
    #              the release: `helm uninstall` keeps it, so delete it by hand to drop the state.
    #   hostPath - a directory on the node (path). Node-local, so only safe where postgres cannot
    #              reschedule onto another node (a single-node cluster). Baseline PSA forbids
    #              hostPath; `namespace` is already PSA-privileged when pki.enabled.
    #   emptyDir - scratch space that dies with the pod: EVERY postgres pod restart or template
    #              change loses ALL dispatch state. Explicit opt-in for throwaway smoke clusters only.
    type: pvc
    # storageClass for the pvc; empty uses the cluster's default StorageClass.
    storageClass: ""
    # size of the pvc.
    size: 1Gi
    # path is the node directory for hostPath, created if missing.
    path: /var/lib/ectobase/postgres

images:
  # dispatchApiserver is the dispatch aggregated apiserver image.
  dispatchApiserver: ghcr.io/trevex/ectobase/dispatch-apiserver:dev
  # dispatchController is the dispatch controller image (ClusterPool reconciler + scheduler).
  dispatchController: ghcr.io/trevex/ectobase/dispatch-controller:dev
  # mesh is the shared image for the mesh-controller (compiler) and reflector binaries.
  mesh: ghcr.io/trevex/ectobase/mesh:dev
  # kine is the etcd-v3 shim image.
  kine: rancher/kine:v0.13.0
  # postgres is the backing storage for kine (dev/smoke; not HA).
  postgres: postgres:16
