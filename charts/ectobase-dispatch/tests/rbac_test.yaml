suite: dispatch mesh-controller rbac
templates:
  - templates/rbac.yaml
tests:
  # Dispatch rbac.yaml documents (0-indexed):
  #   0: SA  mesh-controller
  #   1: CR  mesh-controller  (compiled.ectobase.dev full write rules)
  #   2: CRB mesh-controller
  #   3: SA  mesh-reflector
  - it: mesh-controller ClusterRole carries a compiled.ectobase.dev write rule
    asserts:
      - isKind:
          of: ClusterRole
        documentIndex: 1
      - contains:
          path: rules
          content:
            apiGroups: ["compiled.ectobase.dev"]
            resources: ["compiledcontainers", "compilednics", "compiledvms", "compiledvolumeattachments"]
            verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
        documentIndex: 1
