suite: dispatch dispatch-broker rbac
templates:
  - templates/broker-identity.yaml
tests:
  # This template used to render a fleet-wide ClusterRole bound to the "ectobase:brokers" cert
  # group, which let every pool's credential READ every other pool's compiled state — admission
  # never sees a GET/LIST, so nothing but the broker's own client-side filter stood in the way.
  #
  # A pool's access is now provisioned per pool at enrollment: namespace-scoped for its compiled
  # objects, resourceNames-scoped for the cluster-scoped ones it owns, status-subresource-only for
  # every write. So this template must render NOTHING — a fleet-wide grant reappearing here would
  # silently re-open cross-pool reads, which is exactly the regression worth catching.
  - it: renders no fleet-wide broker RBAC
    asserts:
      - hasDocuments:
          count: 0
