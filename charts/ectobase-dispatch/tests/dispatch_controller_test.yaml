suite: dispatch-controller deployment
templates:
  - templates/dispatch-controller.yaml
tests:
  # dispatch-controller.yaml documents (0-indexed):
  #   0: SA dispatch-controller   1: CR dispatch-controller   2: CRB dispatch-controller   3: Deployment
  - it: deployment args include reflector-admin
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "-reflector-admin=[fd00:db8:0:1::1]:1339"
        documentIndex: 3
  # Without it the manager retries a forbidden lease forever and never starts the failover
  # reconcilers — no crash, just a silent outage.
  - it: may hold its leader-election lease
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["coordination.k8s.io"]
            resources: ["leases"]
            verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
        documentIndex: 1
  # The signer trusts a fleet identity's own spec.permittedUnderlayCIDRs, so a default install must
  # trust none: every identity is then a pool, constrained by its ClusterPool's underlayPrefix.
  - it: trusts no fleet identity by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "-routebus-fleet-identities=edge"
        documentIndex: 3
  - it: passes the fleet identities to the signer
    set:
      pki.fleetIdentities: ["edge", "wan"]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "-routebus-fleet-identities=edge,wan"
        documentIndex: 3
  # A route-bus intermediate covering the reflector's or the apiserver's IP SAN could mint a leaf the
  # agents and brokers would take for that server, so the signer is told both.
  - it: passes the dispatch server IPs to the signer
    set:
      pki.reflectorIP: "fd00:db8:0:1::1"
      dispatchApiserver.serviceIP: "fd00:db8:0:1::2"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "-routebus-server-ips=fd00:db8:0:1::1,fd00:db8:0:1::2"
        documentIndex: 3
