---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: networkinterfaces.net.ectobase.dev
spec:
  group: net.ectobase.dev
  names:
    kind: NetworkInterface
    listKind: NetworkInterfaceList
    plural: networkinterfaces
    singular: networkinterface
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: 'NetworkInterface is a thin NIC attached to a VM: identity plus
          user-specified overlay IPs.'
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NetworkInterfaceSpec is the desired state of a NetworkInterface
              (a thin NIC).
            properties:
              ips:
                description: |-
                  IPs are the user-specified overlay IPs (v4 and/or v6). The platform does
                  not allocate these.
                items:
                  type: string
                type: array
              nodeName:
                description: NodeName is the node the interface is scheduled onto.
                  Set by the scheduler.
                type: string
              vpcRef:
                description: VPCRef references the VPC this interface belongs to.
                properties:
                  name:
                    description: Name is the name of the referenced object.
                    type: string
                required:
                - name
                type: object
            required:
            - vpcRef
            type: object
          status:
            description: NetworkInterfaceStatus is the observed state of a NetworkInterface.
            properties:
              port:
                description: Port describes the dataplane port allocated for this
                  interface.
                properties:
                  name:
                    description: Name is the host-side interface name (e.g. dtapvf_0)
                      for tap ports.
                    type: string
                  pciAddress:
                    description: PCIAddress is the PCI address for vf ports.
                    type: string
                  type:
                    description: Type is the port type (e.g. tap or vf).
                    enum:
                    - tap
                    - vf
                    type: string
                type: object
              state:
                description: State is the current lifecycle state (e.g. Pending, Ready).
                type: string
              underlayRoute:
                description: UnderlayRoute is the allocated underlay /128 from the
                  host's underlay /64.
                type: string
              vni:
                description: VNI is the effective VXLAN network identifier resolved
                  from the VPC.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
