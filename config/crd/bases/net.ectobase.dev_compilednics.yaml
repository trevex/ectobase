---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: compilednics.net.ectobase.dev
spec:
  group: net.ectobase.dev
  names:
    kind: CompiledNIC
    listKind: CompiledNICList
    plural: compilednics
    singular: compilednic
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CompiledNIC is a lowered, node-local bundle of all static per-NIC dataplane config.
          It is produced by the Compile() function from a NetworkInterface + matching NetworkPolicies.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              CompiledNICSpec is the fully lowered, node-local NIC configuration bundle.
              It captures everything the dataplane agent needs for a single NIC: identity,
              underlay, firewall rules (resolved from NetworkPolicy selectors), and NAT block.
              Dynamic routes learned via routebus are NOT included here.
            properties:
              firewall:
                description: Firewall holds the compiled ingress and egress firewall
                  rules.
                properties:
                  egress:
                    description: Egress is the ordered list of egress firewall rules.
                    items:
                      description: CompiledFwRule is a single compiled firewall rule
                        (destination CIDR + proto + port + action).
                      properties:
                        action:
                          description: 'Action is the rule action: "Allow" or "Deny".'
                          type: string
                        cidr:
                          description: CIDR is the destination CIDR to match ("0.0.0.0/0"
                            = any).
                          type: string
                        port:
                          description: Port is the destination port (0 = any).
                          format: int32
                          type: integer
                        proto:
                          description: Proto is the IP protocol ("TCP", "UDP", "ICMP",
                            or "" for any).
                          type: string
                      required:
                      - action
                      - cidr
                      type: object
                    type: array
                  ingress:
                    description: Ingress is the ordered list of ingress firewall rules.
                    items:
                      description: CompiledFwRule is a single compiled firewall rule
                        (destination CIDR + proto + port + action).
                      properties:
                        action:
                          description: 'Action is the rule action: "Allow" or "Deny".'
                          type: string
                        cidr:
                          description: CIDR is the destination CIDR to match ("0.0.0.0/0"
                            = any).
                          type: string
                        port:
                          description: Port is the destination port (0 = any).
                          format: int32
                          type: integer
                        proto:
                          description: Proto is the IP protocol ("TCP", "UDP", "ICMP",
                            or "" for any).
                          type: string
                      required:
                      - action
                      - cidr
                      type: object
                    type: array
                type: object
              lb:
                description: |-
                  LB lists the load balancers this NIC is a backend of. Pure forwarding membership —
                  it grants NO firewall permission (that comes solely from NetworkPolicy).
                items:
                  description: 'CompiledLB is one load-balancer this NIC backs: the
                    VIP (v4 or v6) and its service ports.'
                  properties:
                    ports:
                      description: Ports are the LB service (port, proto) tuples.
                      items:
                        description: CompiledLBPort is one LB service tuple.
                        properties:
                          port:
                            format: int32
                            type: integer
                          proto:
                            type: string
                        required:
                        - port
                        - proto
                        type: object
                      type: array
                    vip:
                      description: VIP is the load-balancer virtual IP (IPv4 or IPv6).
                      type: string
                  required:
                  - vip
                  type: object
                type: array
              nat:
                description: NAT holds NAT gateway config for this NIC, if any.
                properties:
                  natIP:
                    description: NATIP is the public NAT IPv4 address.
                    type: string
                  portMax:
                    description: PortMax is the end of the source-port range (inclusive).
                    format: int32
                    type: integer
                  portMin:
                    description: PortMin is the start of the source-port range (inclusive).
                    format: int32
                    type: integer
                required:
                - natIP
                - portMax
                - portMin
                type: object
              nicRef:
                description: NICRef references the source NetworkInterface by name.
                properties:
                  name:
                    description: Name is the name of the referenced object.
                    type: string
                required:
                - name
                type: object
              nodeName:
                description: NodeName is the node this NIC is scheduled on.
                type: string
              overlayIPs:
                description: OverlayIPs are the guest overlay IP addresses.
                items:
                  type: string
                type: array
              peerImports:
                description: PeerImports lists the prefixes imported from peered VPCs.
                  Each entry carries the peer VNI and the prefixes visible through
                  that peering. Optional; absent when no VPC peerings are active.
                items:
                  description: CompiledPeerImport is one set of prefixes imported
                    from a peered VPC.
                  properties:
                    importPrefixes:
                      description: ImportPrefixes are the CIDR prefixes imported from
                        the peer VPC.
                      items:
                        type: string
                      type: array
                    peerVni:
                      description: PeerVNI is the VXLAN network identifier of the
                        peer VPC.
                      format: int32
                      type: integer
                  required:
                  - peerVni
                  type: object
                type: array
              port:
                description: Port describes the dataplane port allocated for this
                  interface.
                properties:
                  name:
                    description: Name is the host-side interface name (e.g. dtapvf_0)
                      for tap ports.
                    type: string
                  pciAddress:
                    description: PCIAddress is the PCI address for vf ports.
                    type: string
                  type:
                    description: Type is the port type (e.g. tap or vf).
                    enum:
                    - tap
                    - vf
                    type: string
                type: object
              vni:
                description: VNI is the effective VXLAN network identifier for this
                  NIC.
                format: int32
                type: integer
            required:
            - firewall
            - nicRef
            - nodeName
            - port
            - vni
            type: object
          status:
            description: CompiledNICStatus is the observed state of a CompiledNIC.
            properties:
              generationApplied:
                description: GenerationApplied is the ObjectMeta.Generation of the
                  CompiledNIC last applied.
                format: int64
                type: integer
              state:
                description: State is the current lifecycle state (e.g. Applied, Pending).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
