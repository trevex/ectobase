# This kustomization aggregates the CRD manifests for the net.ectobase.dev
# API group. The CRDs under bases/ are generated from api/net/v1alpha1 via
# controller-gen (sigs.k8s.io/controller-tools). The compute/storage/compiled
# groups have their own CRDs under bases/ (synced into the chart by
# hack/sync-chart-crds.sh); this net-scoped kustomization is not the deploy path.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- bases/net.ectobase.dev_vpcs.yaml
- bases/net.ectobase.dev_networkinterfaces.yaml
- bases/net.ectobase.dev_vpcpeerings.yaml
- bases/net.ectobase.dev_firewallpolicies.yaml
- bases/net.ectobase.dev_loadbalancers.yaml
- bases/net.ectobase.dev_natgateways.yaml
- bases/net.ectobase.dev_floatingips.yaml
