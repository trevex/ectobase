# KubeVirt network-binding NAD for the flowplane overlay. virt-controller injects
# this NAD into the virt-launcher pod's Multus annotation (per the `flowplane`
# binding registered in the KubeVirt CR, see the lab KubeVirt deploy (test/lab/internal/deploy/kubevirt.go)), so Multus runs
# our CNI IN THE LAUNCHER POD NETNS. The CNI (deviceType=pod-tap, tapName=tap0)
# creates the tap "tap0" in that netns spliced to a root-netns veth carrying our
# datapath; KubeVirt's domainAttachmentType:tap then opens tap0 as the VM's NIC, and
# our DHCP/ARP/RA responders configure the guest.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: flowplane
  namespace: ectobase-system
spec:
  config: |
    {
      "cniVersion": "1.0.0",
      "name": "flowplane",
      "plugins": [
        {
          "type": "flowplane-cni",
          "deviceType": "pod-tap",
          "tapName": "tap0"
        }
      ]
    }
