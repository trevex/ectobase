apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: xdp-dp
  namespace: ectobase-system
  labels:
    app.kubernetes.io/name: xdp-dp
    app.kubernetes.io/part-of: netplane
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: xdp-dp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xdp-dp
        app.kubernetes.io/part-of: netplane
    spec:
      # Programs the host datapath and listens on the node-local loopback, so it
      # shares the host network namespace (gRPC on 127.0.0.1:1337) and PID ns.
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: xdp-dp
          image: ghcr.io/trevex/dpservice-xdp:dev
          imagePullPolicy: IfNotPresent
          command: ["xdp-dp"]
          # TODO(tune): serve also needs --uplink/--gateway/--gateway-mac and
          # underlay inference; set at deploy time. This is a first-draft placeholder.
          args: ["serve", "--addr=127.0.0.1:1337"]
          env:
            # kind nodes have no native XDP; force generic/SKB mode.
            - name: XDP_DP_SKB_MODE
              value: "1"
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          securityContext:
            # Needs CAP_BPF/CAP_NET_ADMIN to load XDP programs and program the
            # host datapath; privileged is the blunt first-draft form.
            privileged: true
          volumeMounts:
            - name: bpf-fs
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
            - name: netns
              mountPath: /var/run/netns
              mountPropagation: Bidirectional
      volumes:
        - name: bpf-fs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: sys
          hostPath:
            path: /sys
            type: Directory
        - name: lib-modules
          hostPath:
            path: /lib/modules
            type: Directory
        - name: netns
          hostPath:
            path: /var/run/netns
            type: DirectoryOrCreate
