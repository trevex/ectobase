# Downstream pod-materializer: turns broker-synced CompiledContainer (local net.ectobase.dev) into
# a v1.Pod on this compute cluster, attached to the flowplane overlay via Multus + flowplane-cni.
# Runs ONLY on compute pools — the cluster where the container workload actually runs. Uses the
# in-cluster config (a normal pod: it talks to the local apiserver via the kubernetes ClusterIP and
# never touches the datapath, so no hostNetwork).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-materializer
  namespace: ectobase-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-materializer
rules:
  # Read the broker-synced compiled inputs.
  - apiGroups: ["compiled.ectobase.dev"]
    resources: ["compiledcontainers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["compiled.ectobase.dev"]
    resources: ["compiledcontainers/status"]
    verbs: ["get", "update", "patch"]
  # Materialize workload Pods (Owns Pod).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-materializer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pod-materializer
subjects:
  - kind: ServiceAccount
    name: pod-materializer
    namespace: ectobase-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-materializer
  namespace: ectobase-system
  labels:
    app.kubernetes.io/name: pod-materializer
    app.kubernetes.io/part-of: netplane
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pod-materializer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pod-materializer
        app.kubernetes.io/part-of: netplane
    spec:
      serviceAccountName: pod-materializer
      containers:
        - name: pod-materializer
          image: ghcr.io/trevex/ectobase/netplane:dev
          imagePullPolicy: IfNotPresent
          command: ["pod-materializer"]
