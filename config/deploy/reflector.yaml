apiVersion: apps/v1
kind: Deployment
metadata:
  name: reflector
  namespace: ectobase-system
  labels:
    app.kubernetes.io/name: reflector
    app.kubernetes.io/part-of: netplane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: reflector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reflector
        app.kubernetes.io/part-of: netplane
    spec:
      serviceAccountName: netplane-reflector
      # The reflector is the global rendezvous. It runs on hostNetwork and is pinned
      # to the control-plane node, listening on that node's FABRIC loopback
      # (fd00:db8:0:1::1) — reachable from every node (and, in multi-cluster, every
      # compute cluster) over the same IPv6 BGP fabric the dataplane encaps over. This
      # avoids ClusterIP DNAT, which does not work from the hostNetwork agents, and is
      # the address the central reflector would expose cross-cluster.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - operator: Exists
      containers:
        - name: reflector
          image: ghcr.io/trevex/netplane:dev
          imagePullPolicy: IfNotPresent
          command: ["reflector"]
          args: ["--listen=:1338"]
          ports:
            - name: routebus
              containerPort: 1338
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: reflector
  namespace: ectobase-system
  labels:
    app.kubernetes.io/name: reflector
    app.kubernetes.io/part-of: netplane
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: reflector
  ports:
    - name: routebus
      port: 1338
      targetPort: 1338
      protocol: TCP
