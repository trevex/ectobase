apiVersion: apps/v1
kind: Deployment
metadata:
  name: reflector
  namespace: ectobase-system
  labels:
    app.kubernetes.io/name: reflector
    app.kubernetes.io/part-of: netplane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: reflector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reflector
        app.kubernetes.io/part-of: netplane
    spec:
      serviceAccountName: netplane-reflector
      containers:
        - name: reflector
          image: ghcr.io/trevex/netplane:dev
          imagePullPolicy: IfNotPresent
          command: ["reflector"]
          args: ["--listen=:1338"]
          ports:
            - name: routebus
              containerPort: 1338
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: reflector
  namespace: ectobase-system
  labels:
    app.kubernetes.io/name: reflector
    app.kubernetes.io/part-of: netplane
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: reflector
  ports:
    - name: routebus
      port: 1338
      targetPort: 1338
      protocol: TCP
