# Minimal structural CRD for cdi.kubevirt.io/v1beta1 DataVolume, vendored for envtest.
#
# The upstream CDI DataVolume CRD is generated at build time (not committed to the
# containerized-data-importer repo tree) and is a large OpenAPI schema. For envtest we
# only need the apiserver to register the resource and round-trip the object the
# volume-materializer creates. We therefore declare spec/status as structural objects
# that preserve unknown fields, which accepts any valid DataVolume written by the typed
# kubevirt.io/containerized-data-importer-api@v1.64.0 client. This is NOT a substitute
# for the real CRD in a live cluster (no field validation), only a test fixture.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: datavolumes.cdi.kubevirt.io
spec:
  group: cdi.kubevirt.io
  names:
    kind: DataVolume
    listKind: DataVolumeList
    plural: datavolumes
    singular: datavolume
    shortNames:
      - dv
      - dvs
    categories:
      - all
  scope: Namespaced
  versions:
    - name: v1beta1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
