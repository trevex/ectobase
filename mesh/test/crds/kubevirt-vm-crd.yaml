# Minimal structural CRD for kubevirt.io/v1 VirtualMachine, vendored for envtest.
#
# The upstream KubeVirt VirtualMachine CRD is generated at build time (not committed
# to the kubevirt/kubevirt repo tree) and is ~1MB of deep OpenAPI schema. For envtest
# we only need the apiserver to register the resource and round-trip the object the
# vm-materializer creates. We therefore declare spec/status as structural objects that
# preserve unknown fields, which accepts any valid VirtualMachine written by the typed
# kubevirt.io/api@v1.6.6 client. This is NOT a substitute for the real CRD in a live
# cluster (no field validation), only a test fixture.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: virtualmachines.kubevirt.io
spec:
  group: kubevirt.io
  names:
    kind: VirtualMachine
    listKind: VirtualMachineList
    plural: virtualmachines
    singular: virtualmachine
    shortNames:
      - vm
      - vms
    categories:
      - all
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
